<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSR Partner Management · ระบบบริหารจัดการคู่ค้า</title>
<meta name="description" content="ระบบ CRM ส่วนกลางสำหรับบริหารจัดการคู่ค้า: Tiering, Commission, Pipeline Onboarding, Privileges และ KPI ผู้บริหาร">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<style>
  :root{
    --bg:#F4F6FB;--card:#fff;--ink:#101828;--muted:#667085;--line:#E6EAF2;
    --navy:#111C33;--primary:#4F46E5;--primary2:#7C3AED;--teal:#0E9384;--green:#12805C;
    --amber:#B54708;--red:#B42318;--r:14px;--sh:0 6px 22px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Prompt",sans-serif;font-size:13.5px}
  button,input,select,textarea{font:inherit}
  button{cursor:pointer}

  .shell{display:flex;min-height:100vh}
  .rail{width:238px;flex:0 0 238px;background:linear-gradient(180deg,#111C33,#1B2749 60%,#1E2A55);color:#C6D0E4;padding:20px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:11px;padding:0 8px 20px;color:#fff}
  .brand .mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(140deg,var(--primary),var(--teal));display:grid;place-items:center;font-size:15px}
  .brand strong{display:block;font-size:12.5px;line-height:1.3}
  .brand small{color:#8FA0BE;font-size:9.5px}
  .rail-label{padding:6px 10px;color:#7B8AA8;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase}
  .nav{display:grid;gap:3px}
  .nav button{border:0;background:transparent;color:#C6D0E4;display:flex;align-items:center;gap:11px;text-align:left;padding:10px 12px;border-radius:9px;font-size:12.5px;transition:.15s}
  .nav button i{width:16px;text-align:center;font-size:13px;opacity:.9}
  .nav button:hover{background:rgba(255,255,255,.08);color:#fff}
  .nav button.on{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 3px 0 #7C3AED}
  .rail-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.12);font-size:9.5px;color:#8FA0BE;line-height:1.7}

  .main{flex:1;min-width:0}
  .top{position:sticky;top:0;z-index:10;height:64px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 24px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .top h1{margin:0;font-size:15px;font-weight:600;color:var(--navy)}
  .top .sub{font-size:10.5px;color:var(--muted)}
  .chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:11px;color:#344054;display:inline-flex;gap:6px;align-items:center}
  .chip b{color:var(--navy)}
  .content{padding:20px 24px 44px;max-width:1560px;margin:0 auto}

  .grid{display:grid;gap:14px}
  .k4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .k3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .k2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
  .kpi .lab{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px}
  .kpi .lab i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:12px}
  .kpi .val{font-size:23px;font-weight:600;color:var(--navy);margin:8px 0 2px;letter-spacing:-.3px}
  .kpi .foot{font-size:10.5px;color:var(--muted)}
  .up{color:var(--green);font-weight:500}
  .down{color:var(--red);font-weight:500}
  h3{margin:0;font-size:13px;color:var(--navy);font-weight:600}
  .hint{color:var(--muted);font-size:10.5px;margin-top:2px}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:#fff;color:#344054;border-radius:9px;padding:8px 12px;font-size:11.5px;display:inline-flex;gap:7px;align-items:center;transition:.15s}
  .btn:hover{border-color:#C9D4E4;box-shadow:0 3px 10px rgba(16,24,40,.07)}
  .btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.pri:hover{background:#4338CA}
  .btn.soft{background:#EEF2FF;border-color:#E0E7FF;color:#4338CA}
  .btn.dgr{background:#FEF3F2;border-color:#FEE4E2;color:var(--red)}
  .btn.sm{padding:5px 9px;font-size:10.5px}

  .tbl-wrap{overflow:auto}
  table{width:100%;border-collapse:collapse}
  th{background:#F8FAFC;color:#667085;font-size:10px;font-weight:500;text-align:left;padding:9px 10px;white-space:nowrap;position:sticky;top:0}
  td{padding:10px;border-bottom:1px solid #EFF3F8;font-size:11.5px;color:#334155;vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#FAFBFF}
  .nm{color:var(--navy);font-weight:500}
  .s2{color:var(--muted);font-size:10.5px}
  .pill{display:inline-flex;gap:5px;align-items:center;border-radius:999px;padding:3px 9px;font-size:10px;font-weight:500;white-space:nowrap}
  .pill.g{background:#DCFAE6;color:#0F7B4F}
  .pill.y{background:#FEF0C7;color:#B54708}
  .pill.r{background:#FEE4E2;color:#B42318}
  .pill.b{background:#E0EAFF;color:#3538CD}
  .pill.v{background:#F4EBFF;color:#6941C6}
  .pill.n{background:#EEF2F6;color:#475467}
  .bar{height:6px;background:#EEF2F7;border-radius:6px;overflow:hidden;min-width:60px}
  .bar>span{display:block;height:100%;background:linear-gradient(90deg,#818CF8,#4F46E5);border-radius:6px}
  .empty{padding:34px 12px;text-align:center;color:var(--muted);font-size:12px}
  .empty i{display:block;font-size:20px;margin-bottom:8px;color:#B6C2D4}
  .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .inp,.sel{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none;font-size:11.5px;color:#344054}
  .inp:focus,.sel:focus{border-color:#A5B4FC;box-shadow:0 0 0 3px rgba(79,70,229,.12)}

  .kanban{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
  .col{background:#EFF3FA;border-radius:12px;padding:10px;min-height:320px}
  .col.drag{outline:2px dashed #818CF8;background:#EEF2FF}
  .col-h{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 9px;font-size:11.5px;color:var(--navy);font-weight:600}
  .cnt{background:#fff;border-radius:7px;padding:1px 7px;font-size:9.5px;color:var(--muted)}
  .kcard{background:#fff;border:1px solid #E5EAF0;border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab;box-shadow:0 2px 6px rgba(16,24,40,.04)}
  .kcard:active{cursor:grabbing}
  .kcard h4{margin:0 0 3px;font-size:11.5px;color:var(--navy)}
  .kcard .meta{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);margin-top:8px}

  .backdrop{position:fixed;inset:0;background:rgba(16,24,40,.5);display:none;place-items:center;padding:16px;z-index:60;backdrop-filter:blur(2px)}
  .backdrop.open{display:grid}
  .modal{background:#fff;border-radius:16px;width:min(620px,100%);max-height:90vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.25)}
  .modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .modal .mh h3{font-size:15px}
  .modal .mh p{margin:3px 0 0;font-size:10.5px;color:var(--muted)}
  .modal .mb{padding:18px 20px}
  .modal .mf{padding:13px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
  .x{border:0;background:transparent;color:var(--muted);font-size:17px;line-height:1}
  .fld{margin-bottom:12px}
  .fld label{display:block;font-size:11px;color:#475467;margin-bottom:5px}
  .fld input,.fld select,.fld textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;outline:none;font-size:12px}
  .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:#A5B4FC;box-shadow:0 0 0 3px rgba(79,70,229,.12)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,18px);background:var(--navy);color:#fff;border-radius:11px;padding:11px 16px;font-size:12px;opacity:0;pointer-events:none;transition:.25s;z-index:80}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .note{background:#F9FAFB;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:11px;color:#475467;line-height:1.75}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);margin-top:8px}

  @media(max-width:1250px){.k4{grid-template-columns:repeat(2,1fr)}.k3{grid-template-columns:1fr}}
  /* โหมดฝังในเว็บหลัก (?embed=1) */
  html.embed .rail{display:none!important}
  html.embed .main{margin-left:0}
  html.embed .content{padding-top:14px}
  @media(max-width:860px){
    .shell{display:block}
    .rail{width:auto;height:auto;position:static;flex-direction:row;overflow:auto;padding:8px;gap:6px}
    .brand,.rail-label,.rail-foot{display:none}
    .nav{display:flex;gap:6px}
    .nav button{white-space:nowrap;padding:9px 12px}
    .content{padding:16px 14px 34px}
    .k2,.two{grid-template-columns:1fr}
    .top{padding:0 14px;height:58px}
    .kanban{grid-template-columns:repeat(6,220px)}
  }
</style>
</head>

    </header>
    <div class="content" id="view"></div>
  </main>
</div>

  /* ============================================================

  var LS = 'tsr_partner_crm_v1';
  var DB = loadDB();

  function loadDB() {
    try {
      var raw = localStorage.getItem(LS);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && d.settings && d.partners) return d;
      }
    } catch (e) {}
    return JSON.parse(JSON.stringify(SEED));
  }
  function saveDB() {
    try { localStorage.setItem(LS, JSON.stringify(DB)); } catch (e) { toast('บันทึกไม่สำเร็จ (storage เต็ม)'); }
  }

  /* ============================================================
     HELPERS
     ============================================================ */
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function num(n) { return Number(n || 0); }
  function money(n) { return '฿' + Math.round(num(n)).toLocaleString('th-TH'); }
  function shortM(n) {
    n = num(n);
    if (n >= 1000000) return '฿' + (n / 1000000).toFixed(2) + 'M';
    if (n >= 1000) return '฿' + Math.round(n / 1000) + 'K';
    return '฿' + n;
  }
  function pct(n) { return (Math.round(num(n) * 10) / 10) + '%'; }
  function monthOf(d) { return String(d || '').slice(0, 7); }
  function thisMonth() { return new Date().toISOString().slice(0, 7); }
  function addMonths(mk, delta) {
    var y = Number(mk.slice(0, 4)), m = Number(mk.slice(5, 7)) - 1 + delta;
    var d = new Date(Date.UTC(y, m, 1));
    return d.toISOString().slice(0, 7);
  }
  function monthLabel(mk) {
    var names = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
    return names[Number(mk.slice(5, 7)) - 1] + ' ' + String(Number(mk.slice(0, 4)) + 543).slice(-2);
  }
  function toast(m) {
    var t = $('toast'); t.textContent = m; t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 2500);
  }
  function product(code) {
    var list = DB.settings.products;
    for (var i = 0; i < list.length; i++) if (list[i].code === code) return list[i];
    return { code: code, name: code, group: '-', gp: 0, com: 0 };
  }
  function partner(id) {
    var l = DB.partners;
    for (var i = 0; i < l.length; i++) if (l[i].id === id) return l[i];
    return { id: id, name: id, owner: '-', sellOut: 0 };
  }
  function tierOf(code) {
    var t = DB.settings.tiers;
    for (var i = 0; i < t.length; i++) if (t[i].code === code) return t[i];
    return t[0];
  }

  /* ---------- order calculations ---------- */
  function orderCalc(o) {
    var p = product(o.product);
    var grossList = num(o.price) * num(o.qty);
    var disc = grossList * num(o.discount) / 100;
    var net = grossList - disc;                       // ไม่รวม VAT
    var vat = net * num(DB.settings.vat) / 100;
    var inVat = net + vat;                            // รวม VAT (ใช้คิด Tier)
    var gp = net * num(p.gp) / 100;
    var com = net * num(p.com) / 100;
    return { grossList: grossList, disc: disc, net: net, vat: vat, inVat: inVat, gp: gp, com: com };
  }

  function monthlyStats(partnerId, mk) {
    var st = { units: 0, net: 0, inVat: 0, gp: 0, com: 0, orders: 0 };
    DB.orders.forEach(function (o) {
      if (partnerId && o.partnerId !== partnerId) return;
      if (mk && monthOf(o.date) !== mk) return;
      var c = orderCalc(o);
      st.units += num(o.qty); st.net += c.net; st.inVat += c.inVat; st.gp += c.gp; st.com += c.com; st.orders++;
    });
    return st;
  }

  /* ---------- tier engine ---------- */
  function evalTier(partnerId) {
    var mk = thisMonth();
    var st = monthlyStats(partnerId, mk);
    var best = null;
    DB.settings.tiers.forEach(function (t) {
      if (st.units >= num(t.minUnits) || st.inVat >= num(t.minValue)) best = t;
    });
    if (!best) best = DB.settings.tiers[0];
    return { tier: best, stats: st, qualified: st.units > 0 || st.inVat > 0 };
  }

  function retention(partnerId) {
    var p = partner(partnerId);
    var joinMk = p.joined ? monthOf(p.joined) : '';
    var cur = thisMonth();
    var months = [];
    var below = 0, run = 0;
    for (var i = 0; i < num(DB.settings.months); i++) {
      var mk = addMonths(cur, -i);
      if (joinMk && mk < joinMk) break;   // ไม่นับเดือนก่อนเริ่มเป็นคู่ค้า
      var st = monthlyStats(partnerId, mk);
      var hit = st.inVat >= num(DB.settings.target.value) && st.units >= num(DB.settings.target.units);
      months.push({ mk: mk, stats: st, hit: hit });
      if (i > 0 && !hit) below++;
    }
    // consecutive months below target (excluding current month)
    for (var j = 1; j < months.length; j++) { if (months[j].hit) break; run++; }
    return { months: months.reverse(), below: below, consecutive: run };
  }

  function volumeRebate(partnerId, mk) {
    var st = monthlyStats(partnerId, mk);
    var goalValue = num(DB.settings.target.value) || 1;
    var achieve = st.inVat / goalValue * 100;
    var rate = 0;
    DB.settings.rebate.forEach(function (r) { if (achieve >= num(r.pct)) rate = num(r.rebate); });
    return { achieve: achieve, rate: rate, amount: st.net * rate / 100 };
  }

  /* ---------------- Dashboard ---------------- */
  function viewDash() {
    var mk = thisMonth(), prev = addMonths(mk, -1);
    var cur = monthlyStats(null, mk), last = monthlyStats(null, prev);
    var active = DB.partners.filter(function (p) { return monthlyStats(p.id, mk).orders > 0; }).length;
    var sellOut = DB.partners.reduce(function (s, p) { return s + num(p.sellOut); }, 0);
    var growth = last.inVat > 0 ? (cur.inVat - last.inVat) / last.inVat * 100 : 0;
    var gpRate = cur.net > 0 ? cur.gp / cur.net * 100 : 0;

    // Repeat purchase: partners with >=2 distinct months with orders
    var repeat = 0;
    DB.partners.forEach(function (p) {
      var set = {};
      DB.orders.forEach(function (o) { if (o.partnerId === p.id) set[monthOf(o.date)] = 1; });
      if (Object.keys(set).length >= 2) repeat++;
    });
    var repeatRate = DB.partners.length ? repeat / DB.partners.length * 100 : 0;

    // alerts
    var alerts = [];
    DB.partners.forEach(function (p) {
      var r = retention(p.id);
      if (r.consecutive >= 6) alerts.push({ p: p, level: 'tier', text: 'ต่ำกว่าเป้า ' + r.consecutive + ' เดือนติด → ควรทบทวน Tier' });
      else if (r.consecutive >= 2) alerts.push({ p: p, level: 'warn', text: 'ต่ำกว่าเป้า ' + r.consecutive + ' เดือน → วางแผนกระตุ้นยอด' });
    });

    // tier distribution
    var dist = {};
    DB.settings.tiers.forEach(function (t) { dist[t.code] = 0; });
    DB.partners.forEach(function (p) { dist[evalTier(p.id).tier.code]++; });
    var maxDist = Math.max.apply(null, Object.keys(dist).map(function (k) { return dist[k]; }).concat([1]));

    var topPar = DB.partners.map(function (p) {
      return { p: p, st: monthlyStats(p.id, mk) };
    }).sort(function (a, b) { return b.st.inVat - a.st.inVat; }).slice(0, 5);

      + kpi('GP Contribution', shortM(cur.gp), 'fa-solid fa-coins', '#12805C', 'อัตรากำไร ' + pct(gpRate) + ' ของยอดขาย')
      + '</div>'

      + '<div class="grid k3" style="margin-bottom:14px">'
      + '<div class="card"><div class="head"><div><h3>ยอดซื้อรายเดือน (6 เดือน)</h3><div class="hint">In-Vat · เทียบเป้า ' + shortM(DB.settings.target.value) + '</div></div></div>'
      + sparkBars(mk) + '</div>'
      + '<div class="card"><div class="head"><div><h3>การกระจายตัว Tier</h3><div class="hint">คำนวณจากยอดเดือนปัจจุบัน</div></div></div>'
      + DB.settings.tiers.map(function (t) {
          var v = dist[t.code] || 0;
          return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px">'
            + '<div style="width:110px;font-size:11px;color:#344054">' + esc(t.code) + '</div>'
            + '<div class="bar" style="flex:1"><span style="width:' + Math.round(v / maxDist * 100) + '%"></span></div>'
            + '<div style="width:24px;text-align:right;font-size:11px;color:#667085">' + v + '</div></div>';
        }).join('')
      + '</div>'
      + '<div class="card"><div class="head"><div><h3>ตัวชี้วัดคุณภาพ</h3><div class="hint">Repeat Purchase · Growth · GP</div></div></div>'
      + '<div style="display:grid;gap:12px">'
      + statRow('Repeat Purchase', pct(repeatRate), repeat + ' จาก ' + DB.partners.length + ' คู่ค้าซื้อซ้ำ')
      + statRow('Partner Growth', (growth >= 0 ? '+' : '') + pct(growth), 'เทียบเดือนก่อน')
      + statRow('GP Contribution', shortM(cur.gp), 'จากยอดขายสุทธิ ' + shortM(cur.net))
      + statRow('Volume Rebate ที่ต้องคืน', shortM(rebateTotal()), 'คู่ค้าที่ทำได้ ≥120% ของเป้า')

      + (topPar.length ? '<div class="tbl-wrap"><table><thead><tr><th>คู่ค้า</th><th>Tier</th><th>ยอดซื้อ</th><th>มูลค่า</th></tr></thead><tbody>'
          + topPar.map(function (x) {
            var tier = evalTier(x.p.id).tier;

  function kpi(label, val, icon, color, foot) {
    return '<article class="card kpi"><div class="lab">' + label + '<i class="' + icon + '" style="background:' + color + '14;color:' + color + '"></i></div>'

  function sparkBars(mk) {

      arr.push({ mk: k, v: monthlyStats(null, k).inVat });

    return '<div style="display:flex;align-items:flex-end;gap:8px;height:130px">'

          + '<div style="font-size:9px;color:#667085;margin-top:5px">' + monthLabel(x.mk) + '</div></div>';
      }).join('') + '</div>';

      var alert = ret.consecutive >= 6

      var gap = nextTier ? Math.max(0, num(nextTier.minValue) - ev.stats.inVat) : 0;
      return { p: p, ev: ev, ret: ret, alert: alert, nextTier: nextTier, gap: gap };

    return '<div class="card">'

            + '<td>' + (r.nextTier

  function bindKanban() {
    var dragId = null;

  /* ---------------- ทีม & สิทธิ์ (6 ระดับ / เครือข่ายลูกข่าย) ---------------- */
  var LEVELS = {
    admin: { n: 1, name: 'Admin (ผู้ดูแลระบบ)', short: 'Admin', cls: 'r' },
    bu:    { n: 2, name: 'BU (Business Unit)', short: 'BU', cls: 'v' },
    head:  { n: 3, name: 'Head Team', short: 'Head', cls: 'b' },
    sup:   { n: 4, name: 'Supervisor', short: 'Sup', cls: 'b' },
    sale:  { n: 5, name: 'เซลล์ (Sale)', short: 'Sale', cls: 'g' },
    agent: { n: 6, name: 'ตัวแทน / MCN', short: 'Agent', cls: 'n' }
  };
  var LEVEL_ORDER = ['admin', 'bu', 'head', 'sup', 'sale', 'agent'];

  function lv(code) { return LEVELS[code] || LEVELS.agent; }
  function userById(id) {
    var l = DB.users;
    for (var i = 0; i < l.length; i++) if (l[i].id === id) return l[i];
    return null;
  }
  function currentUser() {
    var u = userById(DB.settings.currentUser);
    if (u) return u;
    return DB.users[0] || { id: '', name: '-', level: 'agent', parentId: '' };
  }
  function childrenOf(id) {
    return DB.users.filter(function (u) { return u.parentId === id; });
  }
  function descendantsOf(id) {
    var out = [], queue = [id], guard = 0;
    while (queue.length && guard++ < 5000) {
      var cur = queue.shift();
      childrenOf(cur).forEach(function (u) { out.push(u); queue.push(u.id); });
    }
    return out;
  }
  function scopeUsers() {
    var me = currentUser();
    if (!me || !me.id) return [];
    if (lv(me.level).n === 1) return DB.users.filter(function (u) { return u.id !== me.id; });
    return descendantsOf(me.id);
  }
  function canSee(targetId) {
    var me = currentUser();
    if (!me) return false;
    if (lv(me.level).n === 1) return true;
    return descendantsOf(me.id).some(function (u) { return u.id === targetId; });
  }
  function pathOf(u) {
    var me = currentUser();
    var minN = lv(me.level).n;
    var names = [], cur = u, guard = 0;
    while (cur && guard++ < 20) {
      var p = userById(cur.parentId);
      if (!p) break;
      if (lv(p.level).n >= minN && p.id !== me.id) names.unshift(p.name);  // ไม่แสดงสายงานเหนือตัวเอง
      cur = p;
    }
    return names;
  }

  function viewNetwork() {

    var switcher = '<select class="sel" id="meSwitch" title="สลับผู้ใช้เพื่อทดสอบการมองเห็น">'

    var rows = scope.slice().sort(function (a, b) { return lv(a.level).n - lv(b.level).n || String(a.name).localeCompare(String(b.name)); }).map(function (u) {

        + '<td style="white-space:nowrap"><button class="btn sm" data-editu="' + esc(u.id) + '"><i class="fa-solid fa-pen"></i></button> '
        + '<button class="btn sm dgr" data-delu="' + esc(u.id) + '"><i class="fa-solid fa-trash"></i></button></td>'

    var total = scope.length;
    return '<div class="card" style="margin-bottom:14px">'

      + '<div class="hint">ผู้ที่อยู่ระดับบนจะเห็นลูกข่ายทั้งหมดใต้สายงานของตัวเอง (ทั้งเซลล์และตัวแทน/MCN ใต้เซลล์)</div></div>'
      + '<div class="tools"><span class="s2">มุมมองปัจจุบัน:</span>' + switcher
      + '<button class="btn pri" data-add="user"><i class="fa-solid fa-user-plus"></i> ลงทะเบียน ID</button></div></div>'
      + '<div class="grid k4" style="margin:0">'
      + kpi('ลูกข่ายในสายงาน', String(total), 'fa-solid fa-users', '#4F46E5', 'ไม่รวมตัวเอง (' + lv(me.level).short + ')')
      + kpi('Supervisor', String(byLevel.sup || 0), 'fa-solid fa-user-tie', '#0E9384', 'ทีมที่ดูแล')
      + kpi('เซลล์ (Sale)', String(byLevel.sale || 0), 'fa-solid fa-user-group', '#B54708', 'ผู้ขายในสาย')
      + kpi('ตัวแทน / MCN', String(byLevel.agent || 0), 'fa-solid fa-id-card', '#6941C6', 'ปลายสาย')
      + '</div>'
      + '<div class="note" style="margin-top:12px"><b>ลำดับชั้น:</b> L1 Admin › L2 BU › L3 Head Team › L4 Supervisor › L5 เซลล์ › L6 ตัวแทน/MCN — การสร้าง ID ต้องเลือกระดับและเลือกผู้ดูแลต้นสาย (ต้องเป็นระดับที่สูงกว่าเท่านั้น)</div>'
      + '</div>'

      + '<div class="grid k2">'
      + '<div class="card"><div class="head"><div><h3>แผนผังเครือข่าย</h3><div class="hint">เริ่มจาก ' + esc(me.name) + ' ลงไปยังปลายสาย</div></div></div>'
      + treeNode(me, 0) + '</div>'

      + '<div class="card"><div class="head"><div><h3>รายชื่อในสายงาน (' + scope.length + ')</h3>'
      + '<div class="hint">' + (lv(me.level).n === 1 ? 'Admin เห็นทุกคนในระบบ' : 'เห็นเฉพาะผู้ที่อยู่ใต้สายงานของตัวเอง') + '</div></div>'
      + '<input class="inp" id="uSearch" placeholder="ค้นหาชื่อ/อีเมล" style="min-width:160px"></div>'
      + (scope.length ? '<div class="tbl-wrap" style="max-height:520px"><table id="uTbl"><thead><tr>'
          + '<th>ชื่อ / อีเมล</th><th>ระดับ</th><th>ผู้ดูแล (Upline)</th><th>สายงาน</th><th>สร้างเมื่อ</th><th>สถานะ</th><th></th>'
          + '</tr></thead><tbody>' + rows + '</tbody></table></div>'
          : '<div class="empty"><i class="fa-solid fa-user-slash"></i>ยังไม่มีผู้ใช้ใต้สายงาน</div>')
      + '</div></div>';
  }

  function treeNode(u, depth) {
    var kids = childrenOf(u.id);
    var l = lv(u.level);
    var row = '<div style="display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;margin:0 0 4px ' + (depth * 16) + 'px;'
      + 'background:' + (depth === 0 ? '#EEF2FF' : '#F8FAFC') + ';border:1px solid ' + (depth === 0 ? '#E0E7FF' : '#EFF3F8') + '">'
      + '<span class="pill ' + l.cls + '">L' + l.n + ' ' + l.short + '</span>'
      + '<strong style="font-size:11.5px;color:#111C33">' + esc(u.name) + '</strong>'
      + (kids.length ? '<span class="s2" style="margin-left:auto">' + kids.length + ' ใต้สังกัด</span>' : '')
      + '</div>';
    return row + kids.map(function (k) { return treeNode(k, depth + 1); }).join('');
  }

  function uplinesFor(levelCode) {
    var n = lv(levelCode).n;
    var me = currentUser();
    var pool = DB.users.filter(function (u) {
      var un = lv(u.level).n;
      if (un >= n) return false;
      if (lv(me.level).n === 1) return true;
      return u.id === me.id || descendantsOf(me.id).some(function (x) { return x.id === u.id; });
    });
    return pool.sort(function (a, b) { return lv(a.level).n - lv(b.level).n; });
  }

  function userModal(id) {
    var u = id ? userById(id) : null;
    var isEdit = !!u;
    var preset = u || { name: '', email: '', level: 'sale', parentId: '', status: 'active' };

    var levelOpts = LEVEL_ORDER.map(function (code) {
      var l = LEVELS[code];
      var sel = preset.level === code ? ' selected' : '';
      return '<option value="' + code + '"' + sel + '>L' + l.n + ' · ' + l.name + '</option>';
    }).join('');

    function uplineOpts(levelCode, parentId) {
      var list = uplinesFor(levelCode);
      if (!list.length) return '<option value="">— ยังไม่มีผู้ใช้ระดับบนให้เลือก —</option>';
      return '<option value="">— เลือกผู้ดูแลต้นสาย —</option>' + list.map(function (x) {
        return '<option value="' + esc(x.id) + '"' + (parentId === x.id ? ' selected' : '') + '>' + esc(x.name) + ' · ' + lv(x.level).short + '</option>';
      }).join('');
    }

    openModal(
      '<div class="mh"><div><h3>' + (isEdit ? 'แก้ไข ID / สิทธิ์' : 'ลงทะเบียน ID ใหม่') + '</h3>'
      + '<p>เลือกระดับสิทธิ์ และเลือกผู้ดูแลต้นสาย (ต้องเป็นระดับที่สูงกว่าเท่านั้น)</p></div><button class="x" data-close>&times;</button></div>'
      + '<div class="mb"><form id="uf">'
      + '<div class="fld"><label>ชื่อ-นามสกุล / ชื่อทีม *</label><input name="name" required value="' + esc(preset.name) + '"></div>'
      + '<div class="fld"><label>อีเมล (ใช้เป็น ID เข้าระบบ)</label><input name="email" type="email" value="' + esc(preset.email) + '"></div>'
      + '<div class="two"><div class="fld"><label>ระดับสิทธิ์ *</label><select name="level" id="uLevel">' + levelOpts + '</select></div>'
      + '<div class="fld"><label>ผู้ดูแลต้นสาย *</label><select name="parentId" id="uParent">' + uplineOpts(preset.level, preset.parentId) + '</select></div></div>'
      + '<div class="two"><div class="fld"><label>สถานะ</label><select name="status">'

  /* ============================================================
     EVENTS
     ============================================================ */
  document.addEventListener('click', function (e) {
    var nav = e.target.closest('#nav button');
    if (nav) { VIEW = nav.dataset.view; render(); return; }
    if (e.target.closest('[data-close]')) { closeModal(); return; }
    if (e.target === $('backdrop')) { closeModal(); return; }

    var add = e.target.closest('[data-add]');
    if (add) {
      var k = add.dataset.add;
      if (k === 'partner') partnerModal('');
      else if (k === 'order') orderModal();
      else if (k === 'lead') leadModal();
      else if (k === 'priv') privModal();
      else if (k === 'user') userModal('');
      return;
    }
    var ed = e.target.closest('[data-edit]');
    if (ed) { partnerModal(ed.dataset.edit); return; }
    var edu = e.target.closest('[data-editu]');
    if (edu) {
      if (!canSee(edu.dataset.editu)) { toast('ไม่มีสิทธิ์แก้ไขผู้ใช้ที่อยู่นอกสายงาน'); return; }
      userModal(edu.dataset.editu); return;
    }
    var delu = e.target.closest('[data-delu]');
    if (delu) {
      var uid = delu.dataset.delu;
      if (!canSee(uid)) { toast('ไม่มีสิทธิ์ลบผู้ใช้ที่อยู่นอกสายงาน'); return; }
      if (childrenOf(uid).length) { toast('ลบไม่ได้: ยังมีลูกข่ายใต้สังกัด'); return; }
      if (confirm('ลบ ID นี้?')) {
        DB.users = DB.users.filter(function (x) { return x.id !== uid; });
        saveDB(); render(); toast('ลบ ID แล้ว');
      }
      return;
    }
    var del = e.target.closest('[data-del]');
    if (del) {
      var pid = del.dataset.del;
      if (confirm('ลบคู่ค้านี้ออก? (ออเดอร์ที่เกี่ยวข้องจะยังอยู่)')) {
        DB.partners = DB.partners.filter(function (x) { return x.id !== pid; });
        saveDB(); render(); toast('ลบคู่ค้าแล้ว');
      }
      return;
    }
    var delo = e.target.closest('[data-delorder]');
    if (delo) {
      var oid = delo.dataset.delorder;
      if (confirm('ลบคำสั่งซื้อ ' + oid + ' ?')) {
        DB.orders = DB.orders.filter(function (x) { return x.id !== oid; });
        saveDB(); render(); toast('ลบออเดอร์แล้ว');
      }
      return;
    }
    var el2 = e.target.closest('[data-editlead]');
    if (el2) { leadEditModal(el2.dataset.editlead); return; }
    var dl2 = e.target.closest('[data-dellead]');
    if (dl2) {
      var lid = dl2.dataset.dellead;
      if (confirm('ลบลีดนี้?')) {
        DB.pipeline = DB.pipeline.filter(function (x) { return x.id !== lid; });
        saveDB(); render(); toast('ลบลีดแล้ว');
      }
      return;
    }
    var dp = e.target.closest('[data-delpriv]');
    if (dp) {
      var vid = dp.dataset.delpriv;
      if (confirm('ลบรายการนี้?')) {
        DB.privs = DB.privs.filter(function (x) { return x.id !== vid; });
        saveDB(); render(); toast('ลบแล้ว');
      }
      return;
    }
  });

  // Network: สลับผู้ใช้ + ค้นหา
  document.addEventListener('change', function (e) {
    if (e.target.id === 'meSwitch') {
      DB.settings.currentUser = e.target.value;
      saveDB(); render();
      toast('มุมมองเปลี่ยนเป็น: ' + currentUser().name);
    }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id !== 'uSearch') return;
    var q = e.target.value.toLowerCase();
    Array.prototype.forEach.call(document.querySelectorAll('#uTbl tbody tr'), function (tr) {
      tr.style.display = tr.textContent.toLowerCase().indexOf(q) >= 0 ? '' : 'none';
    });
  });

  // Admin: บันทึกการตั้งค่า
  document.addEventListener('click', function (e) {
    if (e.target.closest('#saveTiers')) {
      Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (inp) {
        var parts = inp.dataset.t.split('-'), i = Number(parts[0]), key = parts[1];
        var t = DB.settings.tiers[i];
        if (!t) return;
        t[key] = (key === 'code' || key === 'name') ? inp.value.trim() : num(inp.value);
      });
      DB.settings.tiers.sort(function (a, b) { return num(a.minValue) - num(b.minValue); });
      saveDB(); render(); toast('บันทึกเกณฑ์ Tier แล้ว');
    }
    if (e.target.closest('#saveProducts')) {
      Array.prototype.forEach.call(document.querySelectorAll('[data-p]'), function (inp) {
        var parts = inp.dataset.p.split('-'), i = Number(parts[0]), key = parts[1];
        var p = DB.settings.products[i];
        if (!p) return;
        p[key] = (key === 'name' || key === 'group') ? inp.value.trim() : num(inp.value);
      });
      saveDB(); render(); toast('บันทึกสินค้า/GP/Commission แล้ว');
    }
    if (e.target.closest('#saveRules')) {
      DB.settings.target.value = num($('tgValue').value);
      DB.settings.target.units = num($('tgUnits').value);
      DB.settings.rebate[0] = { pct: num($('rb1p').value), rebate: num($('rb1v').value) };
      DB.settings.rebate[1] = { pct: num($('rb2p').value), rebate: num($('rb2v').value) };
      DB.settings.vat = num($('vatInp').value);
      saveDB(); render(); toast('บันทึกเป้าหมาย/Rebate แล้ว');
    }
    if (e.target.closest('#reset2')) {
      if (confirm('รีเซ็ตข้อมูลกลับเป็นตัวอย่างเริ่มต้น?')) {
        DB = JSON.parse(JSON.stringify(SEED));
        saveDB(); render(); toast('รีเซ็ตข้อมูลแล้ว');
      }
    }
    if (e.target.closest('#exp2') || e.target.closest('#exportBtn')) exportJSON();
    if (e.target.closest('#imp2') || e.target.closest('#importBtn')) $('fileInp').click();
  });

  function exportJSON() {
    var blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'tsr-partner-crm-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    toast('ส่งออกข้อมูลแล้ว');
  }

  $('fileInp').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(String(r.result));
        if (!d.settings || !d.partners) throw new Error('รูปแบบไฟล์ไม่ถูกต้อง');
        DB = d; saveDB(); render(); toast('นำเข้าข้อมูลสำเร็จ');
      } catch (ex) { toast('นำเข้าไม่สำเร็จ: ' + ex.message); }
    };
    r.readAsText(f);
    this.value = '';
  });

  /* ---------------- boot ---------------- */
  render();
})();
</script>
</body>
</html>
