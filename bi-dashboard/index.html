<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sale Order BI · Prospect Intelligence</title>
<link rel="stylesheet" href="bi.css?v=1137e">
<link rel="stylesheet" href="polish.css?v=1137e">
<link rel="stylesheet" href="nav.css?v=1137e">
<link rel="stylesheet" href="viz.css?v=1137e">
<link rel="stylesheet" href="tabs.css?v=1137e">
<link rel="stylesheet" href="ui.css?v=1137e">
<link rel="stylesheet" href="polish2.css?v=1137e">
<link rel="stylesheet" href="summary.css?v=1137e">
<link rel="stylesheet" href="mobile.css?v=1137e">
</head>
<body class="nav-off">
<div class="pbi-shell">

  <!-- ===== top bar ===== -->
  <div class="pbi-topbar">
    <div class="tb-group">
      <div class="pbi-brand"><span class="dot"></span> Sale Order BI</div>
    </div>
    <div class="tb-group tb-actions">
      <button class="btn primary" id="btnImport"
        title="เลือกไฟล์ *_ListBooking.xlsx ที่ IT สร้างให้ทุกเช้า · ไฟล์ถูกอ่านในเบราว์เซอร์เท่านั้น ไม่มีการอัปโหลด · หรือลากไฟล์มาวางที่หน้าเว็บได้เลย">⇪ Import</button>
      <button class="btn" id="btnExport" disabled>⤓ Export</button>
      <button class="btn" id="btnSaveView" title="บันทึกมุมมองปัจจุบัน (หน้า + ช่วงเดือน + ตัวกรอง) แล้วเปิดใหม่จะแสดงแบบนี้ทันที">✓ Save</button>
      <button class="btn icon" id="btnSaveClear" title="ล้างมุมมองที่บันทึกไว้">⟲</button>
    </div>
    <div class="tb-sep"></div>
    <div class="pbi-filters" id="filterBar"></div>
    <details class="fdrop more" id="morePages" title="หน้ารายงานเพิ่มเติมของเว็บ (ไม่มีใน Power BI)">
      <summary>⋯ เพิ่มเติม</summary>
      <div class="flist" id="moreList"></div>
    </details>
    <div class="spacer"></div>
    <div class="pbi-dataset" id="datasetInfo">
      <b>ยังไม่มีข้อมูล</b><span>กด Import ListBooking (.xlsx) เพื่อเริ่ม</span>
    </div>
  </div>

  <!-- ===== body: stage ===== -->
  <div class="pbi-body">
  <div class="pbi-stage">
    <div class="pbi-canvas" id="canvas">
      <div class="pbi-page active" id="page-overview"></div>
      <div class="pbi-page" id="page-status"></div>
      <div class="pbi-page" id="page-tat"></div>
      <div class="pbi-page" id="page-data"></div>
      <div class="pbi-page" id="page-soon"></div>
    </div>
  </div>

  </div>

  <!-- ===== page tabs (ด้านล่าง) ===== -->
  <div class="pbi-pagetabs" id="pageTabs"></div>
</div>

<!-- ===== drag hint (แสดงเฉพาะตอนลากไฟล์มาวาง) ===== -->
<div class="drop hidden" id="dropOverlay">
  <div class="drop-card slim">
    <div class="drop-zone" id="dropZone">
      <div class="big">วางไฟล์เพื่อนำเข้า</div>
      <div class="small">*_ListBooking.xlsx · อ่านในเบราว์เซอร์ ไม่มีการอัปโหลด</div>
    </div>
  </div>
</div>

<!-- ===== view saved toast ===== -->
<div class="toast hidden" id="viewToast">
  <div class="toast-head">มุมมอง</div>
  <div class="status"></div>
</div>

<!-- ===== import progress toast ===== -->
<div class="toast hidden" id="importToast">
  <div class="toast-head">Import ListBooking</div>
  <div class="progress" id="progress"><i id="progressBar"></i></div>
  <div class="status" id="importStatus"></div>
</div>

<input type="file" id="fileInput" accept=".xlsx" hidden>

<script src="xlsx-lite.js?v=1137e"></script>
<script src="lookups.js?v=1137e"></script>
<script src="master-status.js?v=1137e"></script>
<script src="schema.js?v=1137e"></script>
<script src="app.js?v=1137e"></script>
</body>
</html>
