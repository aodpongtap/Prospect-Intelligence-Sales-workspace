name: daily-sheet-backup

# สำรอง Google Sheet อัตโนมัติทุกวัน ~02:00 (Asia/Bangkok = 19:00 UTC ของวันก่อน)
# ไม่ต้องตั้ง secret: endpoint ฝั่ง Apps Script จำกัดการทำงานไม่เกิน 1 ครั้ง / 20 ชั่วโมง

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Apps Script backup
        run: |
          URL="https://script.google.com/macros/s/AKfycbwHKKd0IlCKNylIjK2LilDkeisbIbqaqiIkmuodlp3ZgWortsO9HLY4jNjCjMmAphW-/exec?api=1&action=backupDaily"
          curl -sS -L --max-time 180 "$URL" -o /tmp/backup.json -w "HTTP %{http_code}\n"
          head -c 300 /tmp/backup.json || true
