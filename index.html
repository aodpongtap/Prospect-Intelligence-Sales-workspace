  <script>
    // RBAC helper มาจาก auth-backend — โหลดเฉพาะเมื่อรันบนเซิร์ฟเวอร์ที่มี /api
    // (บน GitHub Pages / เปิดไฟล์ในเครื่อง จะข้ามไปเพื่อไม่ให้เกิด 404)
    (function () {
      var host = location.hostname;
      var staticHost = location.protocol === 'file:' || host === '' ||
        /(^|\.)github\.io$/.test(host) ||
        /^(localhost|127\.0\.0\.1|\[::1\])$/.test(host);
      if (staticHost) { return; }
      var s = document.createElement('script');
      s.src = '/api/rbac.js';
      document.head.appendChild(s);
    })();
  </script>

  <script src="assets/team-page.js?v=6"></script>
  <script>
    // ตัวช่วยแสดงข้อมูลผู้ใช้/สิทธิ์ — ใช้ร่วมกันทั้ง GitHub Pages และ Google Apps Script
    window.__allowedPages__ = function () {
      var lv = String(((window.__ME__ || {}).level) || '').toLowerCase();
      var MAP = {
        sup: ['dashboard', 'team', 'sales', 'projects', 'intelligence', 'reports'],
        sale: ['dashboard', 'sales'],
        agent: ['dashboard', 'sales']
      };
      return MAP[lv] || null;   // admin / bu / head / editor = เข้าได้ทุกหน้า
    };
    window.__applyMe__ = function (rawMe, opts) {
      opts = opts || {};
      rawMe = rawMe || {};
      var me = {
        email: rawMe.email,
        name: String(rawMe.name || '').trim(),
        level: String(rawMe.level || 'viewer').toLowerCase(),
        saleId: String(rawMe.saleId || '').toUpperCase(),
        isAdmin: rawMe.isAdmin === true || String(rawMe.level || '').toLowerCase() === 'admin'
      };

      // เก็บข้อมูลผู้ใช้ไว้ให้สคริปต์ถัดไปใช้กรองข้อมูล (ต้องมาก่อน mock data)
      window.__ME__ = me;

      var av = document.getElementById('avatar'); if (av) av.textContent = String(me.email).substring(0, 2).toUpperCase();
      var nm = document.getElementById('meName'); if (nm) nm.textContent = me.name || me.email;
      var rl = document.getElementById('meRole'); if (rl) rl.textContent = 'สิทธิ์: ' + String(me.level).toUpperCase();

      if (me.isAdmin) {
        var nav = document.getElementById('navList');
        if (nav) {
          var a = document.createElement('a');
          a.className = 'nav-item';
          a.href = opts.usersUrl || 'users.html';
          a.target = opts.usersTarget || '_self';
          a.style.textDecoration = 'none';
          a.innerHTML = '<i class="fa-solid fa-user-gear"></i>User Management';
          nav.appendChild(a);
        }
      }

      // จำกัดเมนูตามระดับสิทธิ์
      //  - Supervisor (L4): เห็นเฉพาะ "แดชบอร์ดรวมของลูกน้อง"
      //  - Sale / Agent: เห็นเฉพาะงานขายของตัวเอง
      var lvCode = String(me.level).toLowerCase();
      var allow = (window.__allowedPages__ ? window.__allowedPages__() : null);
      if (allow) {
        var navList = document.getElementById('navList');
        if (navList) {
          Array.prototype.slice.call(navList.querySelectorAll('[data-page]')).forEach(function (el) {
            if (allow.indexOf(el.getAttribute('data-page')) < 0) el.remove();
          });
        }
      }

      // Sale / Agent: ซ่อน panel ที่ไม่เกี่ยวกับงานขาย + KPI จากดีลของตัวเอง
      if (lvCode === 'sale' || lvCode === 'agent') {
        var content = document.getElementById('content');
        if (content && window.MutationObserver) {
          var obs = new MutationObserver(function () {
            obs.disconnect();               // กัน loop: หยุดฟังชั่วคราวก่อนแก้ DOM
            try {
              Array.prototype.slice.call(content.querySelectorAll('.panel')).forEach(function (p) {
                var t = p.querySelector('.panel-title');
                if (t && /Alerts|Priority Actions/i.test(t.textContent)) p.remove();
              });
              // ตัวเลข KPI คำนวณจากดีลจริงในสายงาน — ดูแลโดย window.__afterRender__ (paintKpis)
              // Sale: ซ่อนตัวเลขเทียบท้องตลาด (ข้อมูลสมมติ) ที่ไม่เกี่ยวกับดีลของตัวเอง
              if (window.__ME__ && String(window.__ME__.level).toLowerCase() === 'sale') {
                Array.prototype.slice.call(content.querySelectorAll('.kpi-foot')).forEach(function (f) { f.remove(); });
              }
            } catch (e) { /* ignore */ }
            obs.observe(content, { childList: true, subtree: true });   // ฟังต่อ
          });
          obs.observe(content, { childList: true, subtree: true });
        }
      }

      // ปรับคำทักทายตามสิทธิ์: "สวัสดี, Head of Sales" → "สวัสดี, Sale"
      (function () {
        var labels = { admin: 'Admin', bu: 'BU', head: 'Head Team', sup: 'Supervisor', sale: 'เซลล์ (Sale)', agent: 'ตัวแทน / MCN', editor: 'Editor', viewer: 'Viewer' };
        var want = 'สวัสดี, ' + (labels[String(me.level).toLowerCase()] || me.level);
        var content = document.getElementById('content');
        if (!content) return;
        function fixGreeting() {
          var h1 = content.querySelector('h1');
          if (!h1) return;
          var t = h1.textContent || '';
          if (t.indexOf('Head of Sales') >= 0 || /^สวัสดี/.test(t)) {
            if (t !== want) h1.textContent = want;
          }
        }
        if (window.MutationObserver) {
          new MutationObserver(fixGreeting).observe(content, { childList: true, subtree: true });
        }
        document.addEventListener('DOMContentLoaded', fixGreeting);
        setTimeout(fixGreeting, 800);
      })();
      var prof = document.querySelector('.profile');
      if (prof) {
        prof.style.cursor = 'pointer';
        prof.title = 'ออกจากระบบ';
        prof.addEventListener('click', function () {
          if (opts.onLogout) { opts.onLogout(); return; }
          if (window.PIAuth) { PIAuth.logout(); location.replace('login.html'); }
        });
      }
      return me;
    };

    // โหมด GitHub Pages / เปิดไฟล์ในเครื่อง / dev server: บังคับล็อกอินด้วย session ในเครื่อง
    (function () {
      var host = location.hostname;
      var isStatic = location.protocol === 'file:' || host === '' ||
        /(^|\.)github\.io$/.test(host) ||
        /^(localhost|127\.0\.0\.1|\[::1\])$/.test(host);
      if (!isStatic || !window.PIAuth) return;
      var sess = PIAuth.session();
      if (!sess) { location.replace('login.html'); return; }
      window.__applyMe__(sess, {
        usersUrl: 'users.html',
        onLogout: function () { PIAuth.logout(); location.replace('login.html'); }
      });
    })();
  </script>
  <script>
    /* ===== JavaScript: Partner CRM (ฝังเป็นเมนูในเว็บหลัก) + ทีม & สิทธิ์ ===== */
    function renderPartnerCRM() {
      return '<div style="display:flex;flex-direction:column;gap:8px;margin:0 -30px -40px;height:calc(100vh - 120px)">'
        + '<div style="margin:0 30px;padding:9px 13px;border-radius:10px;background:#EFF6FF;border:1px solid #DBEAFE;'
        + 'color:#1E40AF;font-size:11px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
        + '<i class="fa-solid fa-circle-info"></i>'
        + '<span>โมดูลคู่ค้า (Partner CRM) ใช้ข้อมูลชุดแยกจาก Reports — ยอดขายดีลลูกค้าดูที่เมนู Reports</span>'
        + '<a href="index.html?page=reports" style="margin-left:auto;font-weight:600;color:#1D4ED8;text-decoration:none">เปิด Reports →</a>'
        + '</div>'
        + '<iframe src="partner-crm/index.html?embed=1" title="TSR Partner Management" '
        + 'style="flex:1;width:100%;border:0;display:block;background:#F4F6FB" loading="lazy"></iframe>'
        + '</div>';
    }

    var LADDER = [
      { code: 'admin', n: 1, label: 'Admin' },
      { code: 'bu', n: 2, label: 'BU' },
      { code: 'head', n: 3, label: 'Head Team' },
      { code: 'sup', n: 4, label: 'Supervisor' },
      { code: 'sale', n: 5, label: 'เซลล์ (Sale)' },
      { code: 'agent', n: 6, label: 'ตัวแทน / MCN' }
    ];
    function ladderOf(code) {
      for (var i = 0; i < LADDER.length; i++) if (LADDER[i].code === code) return LADDER[i];
      return LADDER[LADDER.length - 1];
    }
    function teamUsers() { return window.__TEAM__ || []; }
    function teamChildren(email) {
      return teamUsers().filter(function (u) { return u.parent === email; });
    }
    function teamDescendants(email) {
      var out = [], queue = [email], guard = 0;
      while (queue.length && guard++ < 3000) {
        var cur = queue.shift();
        teamChildren(cur).forEach(function (u) { out.push(u); queue.push(u.email); });
      }
      return out;
    }
    function injectTeamCss() {
      if (document.getElementById('tm-style')) return;
      var css = ''
        + '.tm-tree,.tm-tree ul{list-style:none;margin:0;padding:0}'
        + '.tm-tree{padding-bottom:4px}'
        + '.tm-tree ul{padding-left:24px;position:relative}'
        + '.tm-tree>li{padding:0}'
        + '.tm-tree ul>li{position:relative;padding:6px 0 0 0}'
        + '.tm-tree ul>li::before{content:"";position:absolute;left:-12px;top:0;bottom:0;border-left:1.5px solid #E3EAF3}'
        + '.tm-tree ul>li:last-child::before{bottom:calc(100% - 32px)}'
        + '.tm-tree ul>li::after{content:"";position:absolute;left:-12px;top:32px;width:13px;border-top:1.5px solid #E3EAF3}'
        + '.tm-node{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #E9EEF5;border-radius:11px;'
        + 'padding:9px 12px;position:relative;z-index:1;transition:box-shadow .16s,border-color .16s}'
        + '.tm-node:hover{border-color:#C7D7EE;box-shadow:0 8px 18px rgba(15,43,70,.08)}'
        + '.tm-av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;'
        + 'color:#fff;flex:0 0 30px;background:#64748B}'
        + '.tm-l1{background:#0F2B46}.tm-l2{background:#7C3AED}.tm-l3{background:#2563EB}'
        + '.tm-l4{background:#0E9384}.tm-l5{background:#D97706}.tm-l6{background:#64748B}'
        + '.tm-name{color:#0F2B46;font-weight:600;font-size:11.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}'
        + '.tm-mail{color:#98A2B3;font-size:9.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}'
        + '.tm-kids{margin-left:auto;color:#667085;font-size:9.5px;white-space:nowrap;background:#F4F7FB;border-radius:99px;padding:3px 8px}'
        + '.tm-lv{background:#EEF2FF;color:#3730A3;border-radius:99px;padding:3px 9px;font-size:9px;white-space:nowrap}'
        + '.tm-me{border-color:#93C5FD;background:#F5F9FF;box-shadow:0 0 0 3px rgba(37,99,235,.08)}'
        + '.tm-modal{max-height:64vh;overflow:auto;padding:2px 2px 6px}'
        + '.tm-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;color:#667085;margin-bottom:12px;'
        + 'background:#F8FAFC;border:1px solid #EEF2F7;border-radius:9px;padding:8px 11px}'
        + '.tm-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}'
        + '.tm-tree-lg .tm-node{padding:11px 14px}'
        + '.tm-tree-lg .tm-name{font-size:12.5px}'
        + '.tm-tree-lg .tm-mail{font-size:10px}'
        + '.tm-tree-lg ul{padding-left:28px}'
        + '@media(max-width:760px){.tm-tree ul{padding-left:16px}.tm-tree ul>li::before{left:-8px}'
        + '.tm-tree ul>li::after{left:-8px;width:9px}.tm-node{padding:8px 10px;gap:8px}'
        + '.tm-lv{display:none}}';
      var el = document.createElement('style');
      el.id = 'tm-style';
      el.textContent = css;
      document.head.appendChild(el);
    }

    function openTeamTree() {
      var me = window.__ME__ || {};
      var users = teamUsers();
      var root = null;
      for (var i = 0; i < users.length; i++) if (users[i].email === me.email) root = users[i];
      injectTeamCss();
      var legend = LADDER.map(function (l) {
        return '<span><i class="tm-dot tm-l' + l.n + '"></i>L' + l.n + ' ' + l.label + '</span>';
      }).join('');
      var body = '<div class="tm-modal">'
        + '<div class="tm-legend">' + legend + '</div>'
        + (root
          ? '<ul class="tm-tree tm-tree-lg">' + teamTree(root, 0) + '</ul>'
          : '<div class="empty"><i class="fa-solid fa-user-slash"></i>ไม่พบข้อมูลของคุณในระบบ</div>')
        + '</div>';
      setModal('แผนผังเครือข่าย', 'เริ่มจาก ' + String(me.name || me.email || '-') + ' · ทั้งหมด ' + users.length + ' คน',
        body, [{ label: 'ปิด', primary: true }], true);
    }

    /** ทีม (BU) ของผู้ใช้ — ไล่ขึ้นหาต้นสายว่าใครเป็น Head Sale ของ BU ไหน (ใช้ร่วมกับหน้า Reports) */
    function teamOfUser(u) {
      var list = teamUsers();
      var heads = (window.SalesReport && SalesReport.teamHeads) || {};
      var seen = {}, cur = u, guard = 0;
      while (cur && guard++ < 10) {
        var em = String(cur.email || '').toLowerCase();
        if (heads[em]) return heads[em];
        if (seen[em]) break;
        seen[em] = 1;
        var p = null;
        for (var i = 0; i < list.length; i++) {
          if (String(list[i].email || '').toLowerCase() === String(cur.parent || '').toLowerCase()) p = list[i];
        }
        cur = p;
      }
      return '';
    }

    function teamTree(u, depth) {
      var kids = teamChildren(u.email);
      var l = ladderOf(u.level);
      var meEmail = (window.__ME__ || {}).email;
      var isMe = u.email === meEmail;
      var label = String(u.name || '').trim();
      var initial = label ? label.charAt(0) : String(u.email || '?').slice(0, 2).toUpperCase();
      var bu = teamOfUser(u);
      var node = '<div class="tm-node' + (isMe ? ' tm-me' : '') + '">'
        + '<span class="tm-av tm-l' + l.n + '">' + initial + '</span>'
        + '<div style="min-width:0">'
        + '  <div class="tm-name">' + String(u.name || u.email) + (isMe ? ' <span style="font-size:9px;color:#2563EB">(คุณ)</span>' : '') + '</div>'
        + '  <div class="tm-mail">' + String(u.email) + '</div>'
        + '</div>'
        + (kids.length ? '<span class="tm-kids">' + kids.length + ' คน</span>' : '')
        + (bu ? '<span class="tm-team">' + bu + '</span>' : '')
        + '<span class="tm-lv">L' + l.n + ' · ' + l.label + '</span>'
        + '</div>';
      return '<li>' + node
        + (kids.length ? '<ul>' + kids.map(function (k) { return teamTree(k, depth + 1); }).join('') + '</ul>' : '')
        + '</li>';
    }

    function renderTeam() {
      var me = window.__ME__ || {};
      var users = teamUsers();
      var myN = ladderOf(me.level).n;
      var byLevel = {};
      LADDER.forEach(function (l) { byLevel[l.code] = 0; });
      users.forEach(function (u) { byLevel[u.level] = (byLevel[u.level] || 0) + 1; });
      var root = null;
      for (var i = 0; i < users.length; i++) if (users[i].email === me.email) { root = users[i]; break; }

      var levelOpts = LADDER.filter(function (l) { return l.n > myN; }).map(function (l) {
        return '<option value="' + l.code + '">L' + l.n + ' · ' + l.label + '</option>';
      }).join('');

      // สิทธิ์ลงทะเบียน ID: Admin / BU / Head Team เท่านั้น (Supervisor ลงไป = อ่านอย่างเดียว)
      window.__CAN_REGISTER__ = myN <= 3;

      var rows = users.map(function (u) {
        var l = ladderOf(u.level);
        var up = '-';
        for (var j = 0; j < users.length; j++) if (users[j].email === u.parent) up = users[j].name || users[j].email;
        if (u.parent && up === '-') up = u.parent;
        return '<tr>'
          + '<td><div class="deal-name">' + String(u.name || u.email) + '</div><div class="muted" style="font-size:10px">' + String(u.email) + '</div></td>'
          + '<td><span class="status" style="background:#E0EAFF;color:#1D4ED8;white-space:nowrap">L' + l.n + ' · ' + l.label + '</span></td>'
          + '<td style="font-size:10.5px">' + up + '</td>'
          + '<td>' + (u.status === 'disabled' ? '<span class="status at-risk">ปิด</span>' : '<span class="status healthy">ใช้งาน</span>') + '</td>'
          + '<td style="font-size:10px;color:#667085">' + (u.createdAt ? String(u.createdAt).slice(0, 10) : '—') + '</td>'
          + '</tr>';
      }).join('');

      var chips = LADDER.map(function (l) {
        return '<span style="display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #E5EAF0;border-radius:99px;padding:5px 11px;font-size:11px;color:#475467">'
          + 'L' + l.n + ' ' + l.label + ' <b style="color:#0F2B46">' + (byLevel[l.code] || 0) + '</b></span>';
      }).join('');

      var formHtml;
      if (window.__CAN_REGISTER__) {
        formHtml = panel('ลงทะเบียน ID ใหม่',
          '<div style="font-size:11px;color:#667085;margin-bottom:10px">สร้างได้เฉพาะระดับที่ต่ำกว่าคุณ (L' + (myN + 1) + ' ลงไป) · ระบบสร้างรหัสผ่านให้และแสดงครั้งเดียว</div>'
          + '<div class="form-grid">'
          + '<div class="form-group"><label>อีเมล *</label><input id="tuEmail" type="email" placeholder="name@company.com"></div>'
          + '<div class="form-group"><label>ชื่อ-นามสกุล</label><input id="tuName" placeholder="ชื่อ-นามสกุล"></div>'
          + '<div class="form-group"><label>ระดับสิทธิ์ *</label><select id="tuLevel">' + (levelOpts || '<option value="">ไม่มีระดับให้สร้าง</option>') + '</select></div>'
          + '<div class="form-group"><label>ผู้ดูแลต้นสาย (Upline) *</label><select id="tuParent"></select></div>'
          + '</div>'
          + '<div style="margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
          + '<button class="btn btn-primary" data-action="save-team"><i class="fa-solid fa-check"></i> บันทึก + สร้างรหัสผ่าน</button>'
          + '<span id="tuMsg" style="font-size:11px;color:#667085"></span></div>', '');
      } else {
        formHtml = panel('สิทธิ์การลงทะเบียน',
          '<div class="alert"><i class="fa-solid fa-lock"></i><span>ระดับ L' + myN + ' (' + ladderOf(me.level).label + ') ดูรายชื่อได้อย่างเดียว — การสร้าง ID ต้องเป็น Admin / BU / Head Team</span></div>', '');
      }

      setTimeout(fillTeamUplines, 40);
      injectTeamCss();

      return pageHead('ทีม & สิทธิ์',
          'คุณคือ L' + myN + ' ' + ladderOf(me.level).label + ' · '
            + (myN === 1 ? 'เห็นทั้งเครือข่าย' : 'เห็นเฉพาะผู้ใช้ในสายงานของคุณ')
            + (window.__CAN_REGISTER__ ? ' · ลงทะเบียน ID ได้' : ' · อ่านอย่างเดียว'),
          '')
        + '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px">' + chips + '</div>'
        + formHtml
        + '<div class="grid cols-2" style="margin-top:15px">'
        + panel('แผนผังเครือข่าย',
            '<div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start">'
              + '<div style="font-size:11.5px;color:#475467">เริ่มจาก <b style="color:#0F2B46">' + String(me.name || me.email || '-')
              + '</b> · ทั้งหมด ' + users.length + ' คน</div>'
              + (root
                ? '<button class="btn btn-primary" data-action="open-tree"><i class="fa-solid fa-sitemap"></i> เปิดแผนผังเครือข่าย</button>'
                : '<div class="empty"><i class="fa-solid fa-user-slash"></i>ไม่พบข้อมูลของคุณในระบบ</div>')
              + '</div>',
            'เปิดเป็นหน้าต่างใหญ่เพื่อดูโครงสร้างทั้งเครือข่าย')
        + panel('รายชื่อในสายงาน (' + users.length + ')',
            users.length
              ? '<div class="table-wrap" style="max-height:460px"><table><thead><tr><th>ชื่อ / อีเมล</th><th>ระดับ</th><th>ผู้ดูแลสาย</th><th>สถานะ</th><th>สร้างเมื่อ</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
              : '<div class="empty"><i class="fa-solid fa-users"></i>ยังไม่มีผู้ใช้ในสายงาน</div>',
            'L1 Admin เห็นทั้งเครือข่าย · ระดับอื่นเห็นเฉพาะลูกข่าย')
        + '</div>';
    }

    function fillTeamUplines() {
      var lv = document.getElementById('tuLevel');
      var box = document.getElementById('tuParent');
      if (!lv || !box) return;
      var n = ladderOf(lv.value).n;
      var me = window.__ME__ || {};
      var meN = ladderOf(me.level).n;
      var list = teamUsers().filter(function (u) { return ladderOf(u.level).n < n; });
      var hasMe = false;
      for (var i = 0; i < list.length; i++) if (list[i].email === me.email) hasMe = true;

      var opts = '';
      // ให้เลือก "ตัวเอง" ได้เสมอ (Head/BU ที่ไม่มีผู้ใช้ระดับบนในสายงาน)
      if (me.email && meN < n && !hasMe) {
        opts += '<option value="' + me.email + '" selected>' + String(me.name || me.email) + ' · L' + meN + ' (คุณ)</option>';
      }
      opts += list.map(function (u, idx) {
        var sel = (!opts && idx === 0) ? ' selected' : '';

    function openDeal(id){const d=deals.find(x=>String(x.id)===String(id));if(!d)return;const score=riskScore(d),reasons=[];if(dayDiff(d.lastActivity)>7)reasons.push(`ไม่มี Activity มาแล้ว ${dayDiff(d.lastActivity)} วัน`);if(Math.ceil((new Date(d.close)-new Date("2026-10-07"))/86400000)<=14&&["Prospect","Qualified"].includes(d.stage))reasons.push("ใกล้วันปิดการขาย แต่ยังอยู่ใน Stage เริ่มต้น");if(d.probability<40)reasons.push(`Probability ต่ำ (${d.probability}%)`);if(!d.nextAction)reasons.push("ยังไม่ได้กำหนด Next Action");if(d.status==="On Hold")reasons.push("สถานะ Deal เป็น On Hold");const activity=d.activity.map((a,i)=>`<div class="timeline-entry"><strong>${a}</strong><small>${thaiDate(d.lastActivity)} · ${i===0?"ล่าสุด":"Activity ก่อนหน้า"}</small></div>`).join("");const body=`<div class="detail-grid"><div class="detail-cell"><small>มูลค่า Deal</small><strong>${money(d.value)}</strong></div><div class="detail-cell"><small>Stage ปัจจุบัน</small><strong>${d.stage}</strong></div><div class="detail-cell"><small>Probability</small><strong>${d.probability}%</strong></div><div class="detail-cell"><small>Expected Close</small><strong>${thaiDate(d.close)}</strong></div><div class="detail-cell"><small>Sales Owner</small><strong>${d.owner} · ${d.team}</strong></div><div class="detail-cell"><small>Risk Score</small><strong><span class="risk-pill ${riskClass(score)}">${score} / 100</span></strong></div></div><h3 class="modal-section-title">Activity Timeline</h3><div class="timeline">${activity}</div><h3 class="modal-section-title">เหตุผลที่ระบบประเมินความเสี่ยง</h3><div class="alert ${score>=60?"red":""}"><i class="fa-solid fa-triangle-exclamation"></i><span>${reasons.length?reasons.join(" · "):"ไม่มีความเสี่ยงที่ตรวจพบในขณะนี้"}</span></div><h3 class="modal-section-title">AI Suggested Action</h3><div class="suggestion">ควรนัดประชุมกับผู้มีอำนาจตัดสินใจภายใน 3 วัน เนื่องจากดีลใกล้วันปิดการขาย แต่ยังไม่มีการยืนยันงบประมาณ</div>`;setModal(d.name,d.customer,body,[{label:"Cancel     const promptCell = s => String(s === null || s === undefined ? '' : s).replace(/\|/g,'/').replace(/\r?\n/g,' ').trim();
    const promptHtml = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    function mdTable(head,rows){
      const body = rows.length ? rows : [head.map((h,i)=>i===0?'ไม่พบข้อมูล':'—')];
      return [head, head.map(()=> '---'), ...body].map(r=>'| '+r.map(promptCell).join(' | ')+' |').join('\n');
    }
    function promptPipelineDeals(){return deals.filter(d=>!["Won","Lost"].includes(d.stage))}

      );
    }

    function prompt3Text(d){
      if(!d)return "ยังไม่มีดีลให้สร้างข้อความติดตาม";
      return `บทบาท (Role): คุณคือที่ปรึกษาการขาย B2B (B2B Sales Coach)

กติกา: ห้ามแต่งราคา/เงื่อนไขที่ไม่มีในข้อมูล, ความยาวไม่เกิน 120 คำต่อแบบ`;
    }
    function promptOwnerRows(){
      const map={};
      deals.forEach(d=>{
        const k=d.owner||"ไม่ระบุ";
        const m=map[k]||(map[k]={owner:k,actual:0,actualN:0,install:0,installN:0,pipe:0,pipeN:0,lost:0,lostN:0});
        const v=Number(d.value||0);
        if(d.stage==="Won"){m.actual+=v;m.actualN++}
        else if(d.stage==="Lost"){m.lost+=v;m.lostN++}
        else if(d.status==="On Hold"){m.install+=v;m.installN++}
        else {m.pipe+=v;m.pipeN++}
      });
      return Object.keys(map).map(k=>{
        const m=map[k],closed=m.actualN+m.lostN;
        return [m.owner,m.actual.toLocaleString("th-TH"),m.actualN,m.install.toLocaleString("th-TH"),m.installN,m.pipe.toLocaleString("th-TH"),m.pipeN,(closed?Math.round(m.actualN/closed*100):0)+"%"];
      });
    }

    function copyToClipboard(text){
      const fallback=()=>{const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(err){}document.body.removeChild(ta);toast("คัดลอก Prompt แล้ว")};
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>toast("คัดลอก Prompt แล้ว"),fallback)}else fallback();
    }
    function copyPromptText(id){const el=document.getElementById(id);if(!el)return;copyToClipboard(el.value!==undefined?el.value:el.textContent)}

    /* ===== การแจ้งเตือน: dropdown พร้อมสถานะ อ่าน / ไม่อ่าน ===== */
    let NOTIFS=[];
    function buildNotifs(){
      const out=[];
      const money=n=>"ยท"+Number(n||0).toLocaleString("th-TH");
      const sr=(window.SalesReport&&SalesReport.data)?SalesReport.data():null;
      const scopedDeals=(window.SalesReport&&SalesReport.scopedDeals)?SalesReport.scopedDeals():(sr?sr.deals:[]);
      if(sr){
        const risky=scopedDeals.filter(d=>d.status===1&&Number(d.prob)<=40);
        if(risky.length)out.push({id:"n-risk",t:"ดีล Pipeline ที่ต้องติดตาม",d:risky.length+" ดีล โอกาสปิด ≤ 40%",time:"จาก Reports"});
        const po=scopedDeals.filter(d=>d.status===2);
        if(po.length)out.push({id:"n-po",t:"รอยืนยัน PO",d:po.length+" ดีล · รวม "+money(po.reduce((a,d)=>a+Number(d.amount||0),0)),time:"จาก Reports"});
        const cancel=scopedDeals.filter(d=>d.status===5);
        if(cancel.length)out.push({id:"n-cancel",t:"ดีลยกเลิก",d:cancel.length+" ดีล · รวม "+money(cancel.reduce((a,d)=>a+Number(d.amount||0),0)),time:"จาก Reports"});
      }
      const pr=(window.ProjectTracking&&ProjectTracking.visible)?ProjectTracking.visible():((window.ProjectTracking&&ProjectTracking.list)?ProjectTracking.list():[]);
      let over=0;
      pr.forEach(p=>(p.tasks||[]).forEach(t=>{if(t.status!=="เสร็จแล้ว"&&t.due&&new Date(t.due+"T00:00:00")<new Date(new Date().toDateString()))over++;}));
      if(over)out.push({id:"n-task",t:"งานเลยกำหนด",d:over+" งานใน Project Tracking",time:"จาก Projects"});
      const blocked=pr.filter(p=>p.blocker&&p.blocker!=="ไม่มี"&&p.blocker!=="-").length;
      if(blocked)out.push({id:"n-block",t:"โครงการติด Blocker",d:blocked+" โครงการ",time:"จาก Projects"});
      if(!out.length)out.push({id:"n-none",t:"ไม่มีการแจ้งเตือน",d:"ทุกอย่างเรียบร้อย",time:"-"});
      return out;
    }
    const NOTIF_KEY="pi_notif_read_v1";
    function notifReadList(){try{return JSON.parse(localStorage.getItem(NOTIF_KEY)||"[]")}catch(e){return []}}
    function notifSaveList(a){try{localStorage.setItem(NOTIF_KEY,JSON.stringify(a))}catch(e){}}
    function notifUnreadCount(){const r=notifReadList();return NOTIFS.filter(n=>r.indexOf(n.id)<0).length}
    function renderNotif(){
      NOTIFS=buildNotifs();
      const read=notifReadList(),panel=document.getElementById("notifPanel");if(!panel)return;
      const unread=NOTIFS.filter(n=>read.indexOf(n.id)<0).length;
      panel.innerHTML='<div class="notif-head"><strong>การแจ้งเตือน'+(unread?' ('+unread+')':'')+'</strong><button data-notif-all>อ่านทั้งหมด</button></div>'
        +(NOTIFS.length?NOTIFS.map(n=>{
          const isRead=read.indexOf(n.id)>=0;
          return '<div class="notif-item '+(isRead?'read':'unread')+'" data-notif="'+n.id+'"><span class="nd"></span><div><div class="nt">'+n.t+'</div><div class="nx">'+n.d+'</div><div class="nx" style="color:#98A2B3;margin-top:3px">'+n.time+' · '+(isRead?'อ่านแล้ว':'ยังไม่อ่าน')+'</div></div></div>';
        }).join(""):'<div class="notif-empty">ไม่มีการแจ้งเตือน</div>');
      const dot=document.getElementById("notifDot");
      if(dot)dot.style.display=unread?"block":"none";
    }
    function toggleNotif(){
      const p=document.getElementById("notifPanel");if(!p)return;
      renderNotif();p.classList.toggle("open");
    }
    document.addEventListener("click",function(e){
      const panel=document.getElementById("notifPanel");if(!panel||!panel.classList.contains("open"))return;
      if(e.target.closest("[data-notif-all]")){
        notifSaveList(NOTIFS.map(n=>n.id));renderNotif();toast("ทำเครื่องหมายอ่านทั้งหมดแล้ว");return;
      }
      const item=e.target.closest("[data-notif]");
      if(item){
        const id=item.dataset.notif,read=notifReadList();
        if(read.indexOf(id)<0){read.push(id);notifSaveList(read);}
        renderNotif();return;
      }
      if(!e.target.closest(".notif-wrap"))panel.classList.remove("open");
    });
    renderNotif();
    document.getElementById("modalBackdrop").addEventListener("click",e=>{if(e.target.id==="modalBackdrop"||e.target.closest("[data-close-modal]"))closeModal()});
    document.getElementById("content").addEventListener("input",e=>{if(e.target.id==="dealSearch")applyDealFilters()});
    document.getElementById("content").addEventListener("change",e=>{if(["ownerFilter","teamFilter","stageFilter","riskFilter","periodFilter"].includes(e.target.id))applyDealFilters();if(e.target.id==="lineTicket")updateLinePreview()});
    document.getElementById("content").addEventListener("click",e=>{
      const row=e.target.closest("[data-deal]");if(row){openDeal(row.dataset.deal);return}
      const customer=e.target.closest("[data-customer]");if(customer){e.preventDefault();openCustomer(customer.dataset.customer);return}
      const project=e.target.closest("[data-project]");if(project){openProject(project.dataset.project);return}
      if(e.target.closest("#sortRisk")){sortDesc=!sortDesc;applyDealFilters();return}
      const action=e.target.closest("[data-action]")?.dataset.action;if(!action)return;
      if(action==="go-back"){if(canGoBack()){try{history.back()}catch(err){goTo("dashboard",false)}}else{goTo("dashboard",false)}return}
      if(action==="go-sales"){currentPage="sales";render()}
      else if(action==="add-team"){if(!window.__CAN_REGISTER__){toast("สิทธิ์ Supervisor ดูได้อย่างเดียว");return}var f=document.getElementById("teamForm");if(f){f.style.display="block";fillTeamUplines();f.scrollIntoView({behavior:"smooth",block:"center"})}}
      else if(action==="save-team"){
        if(!window.__CAN_REGISTER__){toast("สิทธิ์ Supervisor ดูได้อย่างเดียว");return}
        var em=(document.getElementById("tuEmail")||{}).value||"";
        var nm=(document.getElementById("tuName")||{}).value||"";
        var lv=(document.getElementById("tuLevel")||{}).value||"";
        var pr=(document.getElementById("tuParent")||{}).value||"";
        var msg=document.getElementById("tuMsg");
        if(!em||em.indexOf("@")<0){toast("กรอกอีเมลให้ถูกต้อง");return}
        if(!pr){toast("เลือกผู้ดูแลต้นสาย");return}
        if(msg)msg.textContent="กำลังบันทึก...";
        PIAuth.addUser(em.trim(),nm.trim(),lv,pr).then(function(r){
          window.__lastPw__={ email:r.email, password:r.password };
          setModal('สร้าง ID สำเร็จ','กรุณาส่งรหัสผ่านนี้ให้ผู้ใช้ — ระบบจะแสดงเพียงครั้งเดียว',
            '<div style="background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;padding:14px">'
            + '<div style="font-size:12px;color:#92400E;margin-bottom:6px">' + String(r.email) + '</div>'
            + '<code style="font-size:17px;font-weight:600;letter-spacing:1px;color:#0F2B46">' + String(r.password) + '</code>'
            + '</div>',
            [{label:'คัดลอกรหัสผ่าน',icon:'fa-regular fa-copy',action:'copy-pw'},{label:'ปิด',primary:true}]);
          var cbtn=document.querySelector('#modalFoot [data-action="copy-pw"]');
          if(cbtn)cbtn.addEventListener('click',function(){
            var txt=String((window.__lastPw__||{}).password||'');
            if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast('คัดลอกรหัสผ่านแล้ว')},function(){toast('คัดลอกไม่สำเร็จ')})}
            else{toast('คัดลอกไม่สำเร็จ')}
          });
          if(msg)msg.textContent='';
          loadTeam(true);
        }).catch(function(e){if(msg)msg.textContent=e.message;toast("ไม่สำเร็จ: "+e.message)});
      }
      else if(action==="add-deal"){window.SalesReport&&SalesReport.openAddDeal?SalesReport.openAddDeal():showDealForm()}
      else if(action==="open-tree")openTeamTree()
      else if(action==="refresh"){const button=e.target.closest("[data-action]");button.classList.add("loading");button.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i>กำลัง Refresh...';setTimeout(()=>{button.classList.remove("loading");render();toast("Refresh Data สำเร็จ")},1000)}
      else if(action==="export-deals")exportDeals()
      else if(action==="add-project")toast("ฟังก์ชันสร้าง Project พร้อมใช้งาน")
      else if(action==="add-task")toast("กรุณาเลือก Project ก่อนเพิ่ม Task")
      else if(action==="create-ticket")showTicketForm()
      else if(action==="send-line"){document.getElementById("lineStatus").textContent="Sent";document.getElementById("lineStatus").className="status healthy";toast("ส่งข้อความอัปเดตให้ลูกค้าเรียบร้อยแล้ว")}
      else if(action==="save-settings")toast("บันทึกการตั้งค่าเรียบร้อยแล้ว")
      else if(action==="contact-customer")toast("บันทึกการติดต่อลูกค้าแล้ว")
      else if(action==="schedule-maintenance")toast("เพิ่มนัดหมาย Maintenance แล้ว")
      else if(action.startsWith("add-activity-"))showActivityForm(Number(action.split("-").pop()))
      else if(action.startsWith("follow-")){closeModal();toast("เพิ่ม Deal เข้า Follow-up แล้ว")}
      else if(action.startsWith("edit-deal-"))showDealForm(deals.find(d=>String(d.id)===String(action.replace("edit-deal-",""))))
      else if(action==="save-new-deal")saveDeal()
      else if(action.startsWith("save-deal-"))saveDeal(action.replace("save-deal-",""))
      else if(action.startsWith("add-task-"))showTaskForm(Number(action.split("-").pop()))
      else if(action.startsWith("save-task-"))saveTask(Number(action.split("-").pop()))
      else if(action.startsWith("project-status-"))showProjectStatus(Number(action.split("-").pop()))
      else if(action==="save-ticket")saveTicket()

    function exportDeals(){const headers=["ชื่อดีล","ลูกค้า","ผู้รับผิดชอบ","ทีม","มูลค่า","ขั้นตอน","โอกาสปิด (%)","คาดว่าจะปิด","ความเสี่ยง","สถานะ"],rows=deals.map(d=>[d.name,d.customer,d.owner,d.team,Math.round(d.value),stageTH(d.stage),d.probability,thaiDate(d.close),riskScore(d),statusTH(d.status)]),csv=[headers,...rows].map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n"),link=document.createElement("a");link.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));link.download="sale-monitor-"+new Date().toISOString().slice(0,10)+".csv";link.click();URL.revokeObjectURL(link.href);toast("Export CSV สำเร็จ ("+rows.length+" ดีล)")}
    function saveDeal(id=null){const form=document.getElementById("dealForm");if(!form.reportValidity())return;const f=Object.fromEntries(new FormData(form));if(window.__saveDealSheet__&&!id){window.__saveDealSheet__(f);return}if(id){const d=deals.find(x=>x.id===id);Object.assign(d,{...f,value:Number(f.value),probability:Number(f.probability),lastActivity:"2026-10-07",status:"Healthy"});closeModal();render();toast("อัปเดต Deal เรียบร้อยแล้ว")}else{deals.unshift({id:Date.now(),...f,value:Number(f.value),probability:Number(f.probability),lastActivity:"2026-10-07",status:"Healthy",activity:["สร้าง Deal ใหม่"]});closeModal();render();toast("เพิ่ม Deal ใหม่เรียบร้อยแล้ว")}}
    function showActivityForm(id){setModal("Add Activity","บันทึกกิจกรรมสำหรับ Deal",`<form id="activityForm"><div class="form-group"><label>รายละเอียด Activity</label><textarea name="activity" required placeholder="ระบุรายละเอียดการติดต่อ"></textarea><input type="hidden" name="id" value="${id}"></div></form>`,[{label:"Cancel"},{label:"บันทึก Activity",action:"save-activity",primary:true}])}
    function saveActivity(){const form=document.getElementById("activityForm");if(!form.reportValidity())return;const f=Object.fromEntries(new FormData(form)),d=deals.find(x=>String(x.id)===String(f.id));if(!d)return;d.activity=d.activity||[];d.activity.unshift(f.activity);d.lastActivity=new Date().toISOString().slice(0,10);closeModal();render();toast("บันทึก Activity เรียบร้อยแล้ว")}
    function saveTask(id){const form=document.getElementById("taskForm");if(!form.reportValidity())return;const f=Object.fromEntries(new FormData(form));projects.find(p=>p.id===id).tasks.push({...f,status:"รอดำเนินการ"});closeModal();render();toast("เพิ่ม Task เรียบร้อยแล้ว")}
    function showProjectStatus(id){const p=projects.find(x=>x.id===id),body=`<div class="form-grid"><div class="form-group"><label>Project Stage</label><select id="newProjectStage">${stageNames.map(s=>`<option ${s===p.stage?"selected":""}>${s}</option>`).join("")}</select></div><div class="form-group"><label>Progress (%)</label><input id="newProjectProgress" type="number" min="0" max="100" value="${p.progress}"></div><div class="form-group full"><label>Blocker</label><input id="newProjectBlocker" value="${p.blocker}"></div><input type="hidden" id="statusProjectId" value="${id}"></div>`;setModal("Update Project Status",p.name,body,[{label:"Cancel"},{label:"บันทึกสถานะ",action:"save-project-status",primary:true}])}
    function saveProjectStatus(){const p=projects.find(x=>x.id===Number(document.getElementById("statusProjectId").value));p.stage=document.getElementById("newProjectStage").value;p.progress=Number(document.getElementById("newProjectProgress").value);p.blocker=document.getElementById("newProjectBlocker").value;closeModal();render();toast("อัปเดต Project เรียบร้อยแล้ว")}
    function showTicketForm(){const body=`<form id="ticketForm"><div class="form-grid"><div class="form-group"><label>Customer</label><input name="customer" required></div><div class="form-group"><label>Product / Service</label><input name="product" required></div><div class="form-group"><label>Issue Type</label><input name="issue" required></div><div class="form-group"><label>Priority</label><select name="priority"><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select></div></div></form>`;setModal("Create Service Ticket","บันทึก Ticket ใหม่",body,[{label:"Cancel"},{label:"สร้าง Ticket",action:"save-ticket",primary:true}])}
    function saveTicket(){const form=document.getElementById("ticketForm");if(!form.reportValidity())return;const f=Object.fromEntries(new FormData(form));tickets.unshift({id:"T-"+(2409+tickets.length),...f,tech:"ทีม Service",open:"2026-10-07",sla:"2026-10-10",status:"เปิด",next:"ตรวจสอบรายละเอียด",health:82});closeModal();render();toast("สร้าง Service Ticket เรียบร้อยแล้ว")}
