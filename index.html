  <script>
    // เธ•เธฑเธงเธเนเธงเธขเนเธชเธ”เธเธเนเธญเธกเธนเธฅเธเธนเนเนเธเน/เธชเธดเธ—เธเธดเน โ€” เนเธเนเธฃเนเธงเธกเธเธฑเธเธ—เธฑเนเธ GitHub Pages เนเธฅเธฐ Google Apps Script
    window.__applyMe__ = function (rawMe, opts) {
      opts = opts || {};
      rawMe = rawMe || {};
      var me = {
        email: rawMe.email,
        name: String(rawMe.name || '').trim(),
        level: String(rawMe.level || 'viewer').toLowerCase(),
        isAdmin: rawMe.isAdmin === true || String(rawMe.level || '').toLowerCase() === 'admin'
      };

      // เน€เธเนเธเธเนเธญเธกเธนเธฅเธเธนเนเนเธเนเนเธงเนเนเธซเนเธชเธเธฃเธดเธเธ•เนเธ–เธฑเธ”เนเธเนเธเนเธเธฃเธญเธเธเนเธญเธกเธนเธฅ (เธ•เนเธญเธเธกเธฒเธเนเธญเธ mock data)
      window.__ME__ = me;

      var av = document.getElementById('avatar'); if (av) av.textContent = String(me.email).substring(0, 2).toUpperCase();
      var nm = document.getElementById('meName'); if (nm) nm.textContent = me.name || me.email;
      var rl = document.getElementById('meRole'); if (rl) rl.textContent = 'เธชเธดเธ—เธเธดเน: ' + String(me.level).toUpperCase();

      if (me.isAdmin) {
        var nav = document.getElementById('navList');
        if (nav) {
          var a = document.createElement('a');
          a.className = 'nav-item';
          a.href = opts.usersUrl || 'users.html';
          a.target = opts.usersTarget || '_self';
          a.style.textDecoration = 'none';
          a.innerHTML = '<i class="fa-solid fa-users-gear"></i>User Management';
          nav.appendChild(a);
        }
      }

      // เธเธณเธเธฑเธ”เน€เธกเธเธนเธ•เธฒเธกเธฃเธฐเธ”เธฑเธเธชเธดเธ—เธเธดเน
      //  - Supervisor (L4): เน€เธซเนเธเน€เธเธเธฒเธฐ "เนเธ”เธเธเธญเธฃเนเธ”เธฃเธงเธกเธเธญเธเธฅเธนเธเธเนเธญเธ"
      //  - Sale / Agent: เน€เธซเนเธเน€เธเธเธฒเธฐเธเธฒเธเธเธฒเธขเธเธญเธเธ•เธฑเธงเน€เธญเธ
      var lvCode = String(me.level).toLowerCase();
      var NAV_ALLOW = {
        sup: ['dashboard', 'team'],
        sale: ['dashboard', 'sales'],
        agent: ['dashboard', 'sales']
      };
      var allow = NAV_ALLOW[lvCode];
      if (allow) {
        var navList = document.getElementById('navList');
        if (navList) {
          Array.prototype.slice.call(navList.querySelectorAll('[data-page]')).forEach(function (el) {
            if (allow.indexOf(el.getAttribute('data-page')) < 0) el.remove();
          });
        }
      }

      // Sale / Agent: เธเนเธญเธ panel เธ—เธตเนเนเธกเนเน€เธเธตเนเธขเธงเธเธฑเธเธเธฒเธเธเธฒเธข + KPI เธเธฒเธเธ”เธตเธฅเธเธญเธเธ•เธฑเธงเน€เธญเธ
      if (lvCode === 'sale' || lvCode === 'agent') {
        var content = document.getElementById('content');
        if (content && window.MutationObserver) {
          var obs = new MutationObserver(function () {
            obs.disconnect();               // เธเธฑเธ loop: เธซเธขเธธเธ”เธเธฑเธเธเธฑเนเธงเธเธฃเธฒเธงเธเนเธญเธเนเธเน DOM
            try {
              Array.prototype.slice.call(content.querySelectorAll('.panel')).forEach(function (p) {
                var t = p.querySelector('.panel-title');
                if (t && /Alerts|Priority Actions/i.test(t.textContent)) p.remove();
              });
              // เธ•เธฑเธงเน€เธฅเธ KPI เธเธณเธเธงเธ“เธเธฒเธเธ”เธตเธฅเธเธฃเธดเธเนเธเธชเธฒเธขเธเธฒเธ โ€” เธ”เธนเนเธฅเนเธ”เธข window.__afterRender__ (paintKpis)
              // Sale: เธเนเธญเธเธ•เธฑเธงเน€เธฅเธเน€เธ—เธตเธขเธเธ—เนเธญเธเธ•เธฅเธฒเธ” (เธเนเธญเธกเธนเธฅเธชเธกเธกเธ•เธด) เธ—เธตเนเนเธกเนเน€เธเธตเนเธขเธงเธเธฑเธเธ”เธตเธฅเธเธญเธเธ•เธฑเธงเน€เธญเธ
              if (window.__ME__ && String(window.__ME__.level).toLowerCase() === 'sale') {
                Array.prototype.slice.call(content.querySelectorAll('.kpi-foot')).forEach(function (f) { f.remove(); });
              }
            } catch (e) { /* ignore */ }
            obs.observe(content, { childList: true, subtree: true });   // เธเธฑเธเธ•เนเธญ
          });
          obs.observe(content, { childList: true, subtree: true });
        }
      }

      // เธเธฃเธฑเธเธเธณเธ—เธฑเธเธ—เธฒเธขเธ•เธฒเธกเธชเธดเธ—เธเธดเน: "เธชเธงเธฑเธชเธ”เธต, Head of Sales" โ’ "เธชเธงเธฑเธชเธ”เธต, Sale"
      (function () {
        var labels = { admin: 'Admin', bu: 'BU', head: 'Head Team', sup: 'Supervisor', sale: 'เน€เธเธฅเธฅเน (Sale)', agent: 'เธ•เธฑเธงเนเธ—เธ / MCN', editor: 'Editor', viewer: 'Viewer' };
        var want = 'เธชเธงเธฑเธชเธ”เธต, ' + (labels[String(me.level).toLowerCase()] || me.level);
        var content = document.getElementById('content');
        if (!content) return;
        function fixGreeting() {
          var h1 = content.querySelector('h1');
          if (!h1) return;
          var t = h1.textContent || '';
          if (t.indexOf('Head of Sales') >= 0 || /^เธชเธงเธฑเธชเธ”เธต/.test(t)) {
            if (t !== want) h1.textContent = want;
          }
        }
        if (window.MutationObserver) {
          new MutationObserver(fixGreeting).observe(content, { childList: true, subtree: true });
        }
        document.addEventListener('DOMContentLoaded', fixGreeting);
        setTimeout(fixGreeting, 800);
      })();
      var prof = document.querySelector('.profile');
      if (prof) {
        prof.style.cursor = 'pointer';
        prof.title = 'เธญเธญเธเธเธฒเธเธฃเธฐเธเธ';
        prof.addEventListener('click', function () {
          if (opts.onLogout) { opts.onLogout(); return; }
          if (window.PIAuth) { PIAuth.logout(); location.replace('login.html'); }
        });
      }
      return me;
    };

    // เนเธซเธกเธ” GitHub Pages / เน€เธเธดเธ”เนเธเธฅเนเนเธเน€เธเธฃเธทเนเธญเธ / dev server: เธเธฑเธเธเธฑเธเธฅเนเธญเธเธญเธดเธเธ”เนเธงเธข session เนเธเน€เธเธฃเธทเนเธญเธ
    (function () {
      var host = location.hostname;
      var isStatic = location.protocol === 'file:' || host === '' ||
        /(^|\.)github\.io$/.test(host) ||
        /^(localhost|127\.0\.0\.1|\[::1\])$/.test(host);
      if (!isStatic || !window.PIAuth) return;
      var sess = PIAuth.session();
      if (!sess) { location.replace('login.html'); return; }
      window.__applyMe__(sess, {
        usersUrl: 'users.html',
        onLogout: function () { PIAuth.logout(); location.replace('login.html'); }
      });
    })();
  </script>
  <script>
    /* ===== JavaScript: Partner CRM (เธเธฑเธเน€เธเนเธเน€เธกเธเธนเนเธเน€เธงเนเธเธซเธฅเธฑเธ) + เธ—เธตเธก & เธชเธดเธ—เธเธดเน ===== */
    function renderPartnerCRM() {
      return '<div style="position:relative;margin:0 -30px -40px;height:calc(100vh - 120px)">'
        + '<iframe src="partner-crm/index.html?embed=1" title="TSR Partner Management" '
        + 'style="width:100%;height:100%;border:0;display:block;background:#F4F6FB" loading="lazy"></iframe>'
        + '</div>';
    }

    var LADDER = [
      { code: 'admin', n: 1, label: 'Admin' },
      { code: 'bu', n: 2, label: 'BU' },
      { code: 'head', n: 3, label: 'Head Team' },
      { code: 'sup', n: 4, label: 'Supervisor' },
      { code: 'sale', n: 5, label: 'เน€เธเธฅเธฅเน (Sale)' },
      { code: 'agent', n: 6, label: 'เธ•เธฑเธงเนเธ—เธ / MCN' }
    ];
    function ladderOf(code) {
      for (var i = 0; i < LADDER.length; i++) if (LADDER[i].code === code) return LADDER[i];
      return LADDER[LADDER.length - 1];
    }
    function teamUsers() { return window.__TEAM__ || []; }
    function teamChildren(email) {
      return teamUsers().filter(function (u) { return u.parent === email; });
    }
    function teamDescendants(email) {
      var out = [], queue = [email], guard = 0;
      while (queue.length && guard++ < 3000) {
        var cur = queue.shift();
        teamChildren(cur).forEach(function (u) { out.push(u); queue.push(u.email); });
      }
      return out;
    }

        + '.tm-lv{display:none}}';
      var el = document.createElement('style');
      el.id = 'tm-style';
      el.textContent = css;
      document.head.appendChild(el);
    }

    function teamTree(u, depth) {
      var kids = teamChildren(u.email);
      var l = ladderOf(u.level);
      var meEmail = (window.__ME__ || {}).email;
      var isMe = u.email === meEmail;

        + '<span class="tm-av tm-l' + l.n + '">' + String(u.name || u.email || '?').trim().charAt(0) + '</span>'

        + '</div>'
        + (kids.length ? '<span class="tm-kids">' + kids.length + ' เธเธ</span>' : '')
        + '<span class="tm-lv">L' + l.n + ' ยท ' + l.label + '</span>'
        + '</div>';
      return '<li>' + node
        + (kids.length ? '<ul>' + kids.map(function (k) { return teamTree(k, depth + 1); }).join('') + '</ul>' : '')
        + '</li>';
    }

    function renderTeam() {
      var me = window.__ME__ || {};
      var users = teamUsers();
      var myN = ladderOf(me.level).n;
      var byLevel = {};
      LADDER.forEach(function (l) { byLevel[l.code] = 0; });
      users.forEach(function (u) { byLevel[u.level] = (byLevel[u.level] || 0) + 1; });
      var root = null;
      for (var i = 0; i < users.length; i++) if (users[i].email === me.email) { root = users[i]; break; }

      var levelOpts = LADDER.filter(function (l) { return l.n > myN; }).map(function (l) {
        return '<option value="' + l.code + '">L' + l.n + ' ยท ' + l.label + '</option>';
      }).join('');

      // เธชเธดเธ—เธเธดเนเธฅเธเธ—เธฐเน€เธเธตเธขเธ ID: Admin / BU / Head Team เน€เธ—เนเธฒเธเธฑเนเธ (Supervisor เธฅเธเนเธ = เธญเนเธฒเธเธญเธขเนเธฒเธเน€เธ”เธตเธขเธง)
      window.__CAN_REGISTER__ = myN <= 3;

      var rows = users.map(function (u) {

        var up = '-';
        for (var j = 0; j < users.length; j++) if (users[j].email === u.parent) up = users[j].name || users[j].email;
        if (u.parent && up === '-') up = u.parent;
        return '<tr>'
          + '<td><div class="deal-name">' + String(u.name || u.email) + '</div><div class="muted" style="font-size:10px">' + String(u.email) + '</div></td>'
          + '<td><span class="status" style="background:#E0EAFF;color:#1D4ED8;white-space:nowrap">L' + l.n + ' ยท ' + l.label + '</span></td>'
          + '<td style="font-size:10.5px">' + up + '</td>'
          + '<td>' + (u.status === 'disabled' ? '<span class="status at-risk">เธเธดเธ”</span>' : '<span class="status healthy">เนเธเนเธเธฒเธ</span>') + '</td>'
          + '<td style="font-size:10px;color:#667085">' + (u.createdAt ? String(u.createdAt).slice(0, 10) : 'โ€”') + '</td>'

      var chips = LADDER.map(function (l) {

      }).join('');

      var formHtml;
      if (window.__CAN_REGISTER__) {
        formHtml = panel('เธฅเธเธ—เธฐเน€เธเธตเธขเธ ID เนเธซเธกเน',
          '<div style="font-size:11px;color:#667085;margin-bottom:10px">เธชเธฃเนเธฒเธเนเธ”เนเน€เธเธเธฒเธฐเธฃเธฐเธ”เธฑเธเธ—เธตเนเธ•เนเธณเธเธงเนเธฒเธเธธเธ“ (L' + (myN + 1) + ' เธฅเธเนเธ) ยท เธฃเธฐเธเธเธชเธฃเนเธฒเธเธฃเธซเธฑเธชเธเนเธฒเธเนเธซเนเนเธฅเธฐเนเธชเธ”เธเธเธฃเธฑเนเธเน€เธ”เธตเธขเธง</div>'
          + '<div class="form-grid">'
          + '<div class="form-group"><label>เธญเธตเน€เธกเธฅ *</label><input id="tuEmail" type="email" placeholder="name@company.com"></div>'
          + '<div class="form-group"><label>เธเธทเนเธญ-เธเธฒเธกเธชเธเธธเธฅ</label><input id="tuName" placeholder="เธเธทเนเธญ-เธเธฒเธกเธชเธเธธเธฅ"></div>'
          + '<div class="form-group"><label>เธฃเธฐเธ”เธฑเธเธชเธดเธ—เธเธดเน *</label><select id="tuLevel">' + (levelOpts || '<option value="">เนเธกเนเธกเธตเธฃเธฐเธ”เธฑเธเนเธซเนเธชเธฃเนเธฒเธ</option>') + '</select></div>'
          + '<div class="form-group"><label>เธเธนเนเธ”เธนเนเธฅเธ•เนเธเธชเธฒเธข (Upline) *</label><select id="tuParent"></select></div>'
          + '</div>'
          + '<div style="margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
          + '<button class="btn btn-primary" data-action="save-team"><i class="fa-solid fa-check"></i> เธเธฑเธเธ—เธถเธ + เธชเธฃเนเธฒเธเธฃเธซเธฑเธชเธเนเธฒเธ</button>'
          + '<span id="tuMsg" style="font-size:11px;color:#667085"></span></div>', '');
      } else {
        formHtml = panel('เธชเธดเธ—เธเธดเนเธเธฒเธฃเธฅเธเธ—เธฐเน€เธเธตเธขเธ',
          '<div class="alert"><i class="fa-solid fa-lock"></i><span>เธฃเธฐเธ”เธฑเธ L' + myN + ' (' + ladderOf(me.level).label + ') เธ”เธนเธฃเธฒเธขเธเธทเนเธญเนเธ”เนเธญเธขเนเธฒเธเน€เธ”เธตเธขเธง โ€” เธเธฒเธฃเธชเธฃเนเธฒเธ ID เธ•เนเธญเธเน€เธเนเธ Admin / BU / Head Team</span></div>', '');
      }

      setTimeout(fillTeamUplines, 40);
      injectTeamCss();

      return pageHead('เธ—เธตเธก & เธชเธดเธ—เธเธดเน',

    function promptOwnerRows(){
      const map={};

        if(d.stage==="Won"){m.actual+=v;m.actualN++}

        else {m.pipe+=v;m.pipeN++}

        const m=map[k],closed=m.actualN+m.lostN;

      });
    }

    function exportDeals(){const headers=["Deal Name","Customer","Owner","Value","Stage","Probability","Expected Close","Risk Score","Status"],rows=deals.map(d=>[d.name,d.customer,d.owner,d.value,d.stage,d.probability,d.close,riskScore(d),d.status]),csv=[headers,...rows].map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n"),link=document.createElement("a");link.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));link.download="sales-report.csv";link.click();URL.revokeObjectURL(link.href);toast("Export Report เธชเธณเน€เธฃเนเธ")}
    function saveDeal(id=null){const form=document.getElementById("dealForm");if(!form.reportValidity())return;const f=Object.fromEntries(new FormData(form));if(window.__saveDealSheet__&&!id){window.__saveDealSheet__(f);return}if(id){const d=deals.find(x=>x.id===id);Object.assign(d,{...f,value:Number(f.value),probability:Number(f.probability),lastActivity:"2026-10-07",status:"Healthy"});closeModal();render();toast("เธญเธฑเธเน€เธ”เธ• Deal เน€เธฃเธตเธขเธเธฃเนเธญเธขเนเธฅเนเธง")}else{deals.unshift({id:Date.now(),...f,value:Number(f.value),probability:Number(f.probability),lastActivity:"2026-10-07",status:"Healthy",activity:["เธชเธฃเนเธฒเธ Deal เนเธซเธกเน"]});closeModal();render();toast("เน€เธเธดเนเธก Deal เนเธซเธกเนเน€เธฃเธตเธขเธเธฃเนเธญเธขเนเธฅเนเธง")}}

    function saveActivity(){const form=document.getElementById("activityForm");if(!form.reportValidity())return;const f=Object.fromEntries(new FormData(form)),d=deals.find(x=>String(x.id)===String(f.id));if(!d)return;d.activity=d.activity||[];d.activity.unshift(f.activity);d.lastActivity=new Date().toISOString().slice(0,10);closeModal();render();toast("เธเธฑเธเธ—เธถเธ Activity เน€เธฃเธตเธขเธเธฃเนเธญเธขเนเธฅเนเธง")}
    function saveTask(id){const form=document.getElementById("taskForm");if(!form.reportValidity())return;const f=Object.fromEntries(new FormData(form));projects.find(p=>p.id===id).tasks.push({...f,status:"เธฃเธญเธ”เธณเน€เธเธดเธเธเธฒเธฃ"});closeModal();render();toast("เน€เธเธดเนเธก Task เน€เธฃเธตเธขเธเธฃเนเธญเธขเนเธฅเนเธง")}
    function showProjectStatus(id){const p=projects.find(x=>x.id===id),body=`<div class="form-grid"><div class="form-group"><label>Project Stage</label><select id="newProjectStage">${stageNames.map(s=>`<option ${s===p.stage?"selected":""}>${s}</option>`).join("")}</select></div><div class="form-group"><label>Progress (%)</label><input id="newProjectProgress" type="number" min="0" max="100" value="${p.progress}"></div><div class="form-group full"><label>Blocker</label><input id="newProjectBlocker" value="${p.blocker}"></div><input type="hidden" id="statusProjectId" value="${id}"></div>`;setModal("Update Project Status",p.name,body,[{label:"Cancel"},{label:"เธเธฑเธเธ—เธถเธเธชเธ–เธฒเธเธฐ",action:"save-project-status",primary:true}])}
    function saveProjectStatus(){const p=projects.find(x=>x.id===Number(document.getElementById("statusProjectId").value));p.stage=document.getElementById("newProjectStage").value;p.progress=Number(document.getElementById("newProjectProgress").value);p.blocker=document.getElementById("newProjectBlocker").value;closeModal();render();toast("เธญเธฑเธเน€เธ”เธ• Project เน€เธฃเธตเธขเธเธฃเนเธญเธขเนเธฅเนเธง")}
    function showTicketForm(){const body=`<form id="ticketForm"><div class="form-grid"><div class="form-group"><label>Customer</label><input name="customer" required></div><div class="form-group"><label>Product / Service</label><input name="product" required></div><div class="form-group"><label>Issue Type</label><input name="issue" required></div><div class="form-group"><label>Priority</label><select name="priority"><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select></div></div></form>`;setModal("Create Service Ticket","เธเธฑเธเธ—เธถเธ Ticket เนเธซเธกเน",body,[{label:"Cancel"},{label:"เธชเธฃเนเธฒเธ Ticket",action:"save-ticket",primary:true}])}
    function saveTicket(){const form=document.getElementById("ticketForm");if(!form.reportValidity())return;const f=Object.fromEntries(new FormData(form));tickets.unshift({id:"T-"+(2409+tickets.length),...f,tech:"เธ—เธตเธก Service",open:"2026-10-07",sla:"2026-10-10",status:"เน€เธเธดเธ”",next:"เธ•เธฃเธงเธเธชเธญเธเธฃเธฒเธขเธฅเธฐเน€เธญเธตเธขเธ”",health:82});closeModal();render();toast("เธชเธฃเนเธฒเธ Service Ticket เน€เธฃเธตเธขเธเธฃเนเธญเธขเนเธฅเนเธง")}
