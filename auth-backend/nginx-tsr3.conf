# TSR3 – Prospect Management dashboard (port 9501)
# Login required for everything: nginx auth_request -> tsr3-auth backend (pm2, 127.0.0.1:9511)
server {
    listen 9501;
    listen [::]:9501;
    server_name _;

    root /var/www/tsr3;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/tsr3.access.log;
    error_log  /var/log/nginx/tsr3.error.log warn;

    # --- auth gate (applies to every location unless turned off) ---
    auth_request /_tsr3_auth;
    error_page 401 = @tsr3_login;

    location = /_tsr3_auth {
        internal;
        auth_request off;
        proxy_pass http://127.0.0.1:9511/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location @tsr3_login {
        return 302 /login?next=$request_uri;
    }

    # backend: login page, API, user-management page, logout
    location ~ ^/(login|logout|api/|admin/) {
        auth_request off;
        proxy_pass http://127.0.0.1:9511;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 100k;
    }

    location / {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
